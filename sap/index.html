<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPPU Drill Manager · SAP edition</title>
<style>
:root{--navy:#001A4E;--blue:#0057D9;--cyan:#0096D6;--purple:#003399;--gold:#E8A100;--glow:#B8D4FF;--ice:#B8D4FF;--bg:#EEF3FF;--surface:#fff;--ink:#0A1428;--muted:#6B82B0;--line:#C8D8FF;

--font:Arial,'Helvetica Neue',Helvetica,sans-serif;--mono:Arial,'Helvetica Neue',Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.shell{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 13px var(--mono)}
.demo-tag{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(29,200,223,.18);color:var(--cyan);padding:5px 8px;border-radius:4px;white-space:nowrap}
.shell .sp{flex:1}
.shell label{font-size:12px;color:#B9C6DA;display:flex;align-items:center;gap:6px}
.shell select,.shell input{background:#0E2552;border:1px solid #29427A;color:#fff;border-radius:6px;padding:5px 8px;font-size:13.5px}
.shell .btn{background:transparent;border-color:#3A5491;color:#fff}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg);color:var(--ink)}
nav button.on{background:var(--infobg);color:var(--info);font-weight:600}
nav .grp{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8C97AD;padding:14px 12px 6px}
.badge{background:var(--err);color:#fff;border-radius:10px;font:600 11px/1 var(--mono);padding:3px 7px}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:24px;line-height:1.25;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 20px;max-width:80ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1F55C2}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:#E9B9B9}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k{font:500 11.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:28px;font-weight:700;line-height:1.2;margin-top:6px}
.tile .h{font-size:13px;color:var(--muted)}
.tile.good .v{color:var(--ok)} .tile.bad .v{color:var(--err)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap,th.wrap{white-space:normal}
th{font:600 11.5px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#F8FAFC;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:#F6F9FE}
.chip{display:inline-block;font:500 12px/1.7 var(--mono);padding:0 8px;border-radius:4px;white-space:nowrap}
.c-grey{background:var(--greybg);color:var(--grey)}.c-info{background:var(--infobg);color:var(--info)}.c-pur{background:var(--purbg);color:var(--pur)}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-err{background:var(--errbg);color:var(--err)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.w{color:var(--warn);font-weight:600}.e{color:var(--err);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input,.field input,.field select,.field textarea,td input[type=date],td select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;font-size:14px}
td input[type=date]{padding:3px 6px}
.note{border-left:3px solid var(--cyan);background:#F0FBFD;padding:10px 14px;border-radius:0 6px 6px 0;color:#1E4E5C;margin-bottom:16px;max-width:90ch}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed #9DB3D6;border-radius:8px;padding:12px 16px;margin-bottom:18px}
.todo{display:grid;gap:8px}
.todo .it{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.list{margin:0;padding-left:18px}.list li{margin:3px 0}
.heat td{text-align:center;padding:6px 4px;font:500 12.5px var(--mono)}
.heat td:first-child{text-align:left;padding-left:12px}
.overlay{position:fixed;inset:0;background:rgba(0,18,59,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:22px 24px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.modalwrap{position:fixed;inset:0;background:rgba(0,18,59,.4);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px 24px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.field{display:grid;gap:4px;margin:12px 0}
.field label{font-size:13px;font-weight:600}
.field textarea{min-height:70px}
.hist{border-left:2px solid var(--line);margin:8px 0 0 4px;padding-left:14px;display:grid;gap:8px;font-size:13.5px}
.hist .at{font:12px var(--mono);color:var(--muted)}
.msgs{display:grid;gap:4px;margin:8px 0}
.msgs div{font-size:13.5px;padding:6px 10px;border-radius:5px}
.msgs .e{background:var(--errbg)}.msgs .w{background:var(--warnbg)}.msgs .ok{background:var(--okbg);color:var(--ok)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.email{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px;background:#fff}
.email .meta{font:12px var(--mono);color:var(--muted)}
.sec{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.ci{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.ct{flex:1;min-width:220px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:10px 14px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:14px;min-width:64px}
.seg button:last-child{border-right:0}
.seg .on-Met{background:var(--okbg);color:var(--ok)}.seg .on-Partly{background:var(--warnbg);color:var(--warn)}.seg .on-Notmet{background:var(--errbg);color:var(--err)}.seg .on-NA{background:var(--greybg);color:var(--grey)}
.big{font-size:15px!important;padding:9px 10px!important;border:1px solid var(--line);border-radius:6px;background:#fff}
.btn.big{padding:12px 20px;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--infobg);color:var(--info);border-radius:14px;padding:4px 6px 4px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.pill button{all:unset;cursor:pointer;padding:0 6px;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;margin:5px 0;font-size:13.5px}
.bt{background:var(--bg);border-radius:3px;height:12px;overflow:hidden}.bt div{height:100%;border-radius:3px}.bn{font:500 12.5px var(--mono);white-space:nowrap}
.sigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sig{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;border-top:4px solid var(--line)}
.sig .k{font:600 11.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.sig.done{border-top-color:var(--ok)}.sig.next{border-top-color:var(--warn);background:#FFFBF2}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:180px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;height:100%}.cb{flex:1;width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center}
.c1,.c2{width:40%;border-radius:3px 3px 0 0;min-height:1px}.c1{background:var(--ice)}.c2{background:var(--blue)}.cl{font:12px var(--mono);color:var(--muted);margin-top:4px}
@media (max-width:860px){.sigs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav .grp{display:none}nav button{white-space:nowrap}main{padding:18px 16px 60px}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
@media print{.shell,nav,.noprint{display:none!important}.layout{display:block}main{padding:0}.card,.tbl{border:0}}

/* ---- SAP command-center look ---- */
.shell{background:linear-gradient(90deg,#001A4E 0%,#003399 60%,#0057D9 100%);box-shadow:0 2px 8px rgba(0,0,0,.3)}

.brand .sep{width:1px;height:22px;background:rgba(255,255,255,.35)}

.shell .btn{border-color:rgba(184,212,255,.5)}
nav{background:linear-gradient(180deg,#001A4E 0%,#002266 100%);border-right:0;padding:10px 0}
nav button{color:rgba(255,255,255,.72);border-radius:0;border-left:3px solid transparent;padding:9px 14px;font-size:13.5px}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:linear-gradient(90deg,rgba(0,86,217,.45),rgba(0,86,217,.1));color:#fff;border-left-color:var(--gold);font-weight:700}
nav .grp{color:rgba(255,255,255,.38);font-weight:700;letter-spacing:.12em;font-size:10.5px}
main h1{color:var(--navy)}
main>h1:first-child,main>div>h1:first-child{border-bottom:2px solid var(--gold);padding-bottom:8px;display:inline-block}
.card,.tbl,.tile{border-color:var(--line);box-shadow:0 1px 4px rgba(0,26,78,.07)}
.tile{border-top:3px solid var(--blue)}
.tile.good{border-top-color:var(--ok)}.tile.bad{border-top-color:var(--err)}
th{background:#F2F6FF;color:var(--s,#003399);font-weight:700;font-size:11px}
.btn.primary{background:linear-gradient(135deg,#0057D9,#003399);border-color:#003399;box-shadow:0 2px 8px rgba(0,51,153,.25)}
.btn.primary:hover{background:linear-gradient(135deg,#0057D9,#001A4E)}
.btn:hover{border-color:var(--blue)}
.note{border-left-color:var(--gold);background:#FFF8E6;color:#4A3500}
.banner{border-color:#89B4F5;background:#F7FAFF}
.tabs button.on{color:var(--blue);border-color:var(--gold)}
.toast{background:linear-gradient(90deg,#001A4E,#003399);border-bottom:2px solid var(--gold)}
@media (max-width:860px){nav{padding:6px}nav button{border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--gold)}}
</style>

/* ---------- Date helpers (ISO yyyy-mm-dd, UTC) ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=t=>t.toISOString().slice(0,10);
const addDays=(s,n)=>{const t=D(s);t.setUTCDate(t.getUTCDate()+n);return iso(t)};
const dow=s=>D(s).getUTCDay();
const diffDays=(a,b)=>Math.round((D(b)-D(a))/864e5);
const weekStart=s=>addDays(s,-dow(s)); /* KSA working week starts Sunday */
const fmt=s=>s?`${+s.slice(8)} ${MON[+s.slice(5,7)-1]} ${s.slice(0,4)}`:'—';
const fmtd=s=>s?`${DOWN[dow(s)]} ${fmt(s)}`:'—';
const pad=n=>String(n).padStart(2,'0');
const monthEnd=m=>iso(new Date(Date.UTC(YEAR,m,0)));
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function periods(f){const o=[];
 if(f==='M')for(let m=1;m<=12;m++)o.push({key:`${YEAR}-${pad(m)}`,label:`${MON[m-1]} ${YEAR}`,start:`${YEAR}-${pad(m)}-01`,end:monthEnd(m)});
 if(f==='Q'||f==='Q3')for(let q=1;q<=4;q++){const p={key:`${YEAR}Q${q}`,label:`Q${q} ${YEAR}`,start:`${YEAR}-${pad(q*3-2)}-01`,end:monthEnd(q*3)};
  if(f==='Q')o.push(p);else['Day','Evening','Night'].forEach(sh=>o.push({...p,shift:sh}))}
 if(f==='H'){o.push({key:`${YEAR}H1`,label:`H1 ${YEAR}`,start:`${YEAR}-01-01`,end:`${YEAR}-06-30`});o.push({key:`${YEAR}H2`,label:`H2 ${YEAR}`,start:`${YEAR}-07-01`,end:`${YEAR}-12-31`})}
 if(f==='Y')o.push({key:`${YEAR}`,label:`Year ${YEAR}`,start:`${YEAR}-01-01`,end:`${YEAR}-12-31`});
 return o}

/* ---------- Business rules: date check ---------- */
function check(d,date,mode='plan'){const e=[],w=[];
 if(!date)return{e:['Pick a date'],w};
 if(date.slice(0,4)!==String(YEAR))e.push(`Date must be in ${YEAR}`);
 const inWin=date>=d.start&&date<=d.end;
 if(mode==='plan'&&!inWin)e.push(`Outside the required period (${fmt(d.start)} to ${fmt(d.end)})`);
 if(mode==='change'&&!inWin)w.push(`Moves out of its required period (${d.label}); that period's mandatory drill would be missed`);
 if(mode==='redo'){const m=d.notDoneDate.slice(0,7);if(date.slice(0,7)!==m)e.push(`A redo must be in the same month (${MON[+m.slice(5)-1]})`);if(date<=d.notDoneDate)e.push('A redo must be after the drill that was not completed')}
 if(mode!=='plan'&&date<=S.demoDate)e.push(`Must be after today (demo date ${fmt(S.demoDate)})`);
 if(mode==='change'&&d.original&&date<d.original&&S.settings.earlierOff)w.push('Earlier than the approved date: counts as off-schedule (setting)');
 const wd=dow(date);if(wd===5||wd===6)w.push(`${DOWN[wd]} is a weekend day`);
 const h=holiday(date);if(h)w.push(`Public holiday: ${h}`);
 if(inRamadan(date))w.push('During Ramadan (reduced working hours)');
 const oth=S.drills.filter(x=>x.id!==d.id&&x.area===d.area&&eff(x));
 const same=oth.filter(x=>eff(x)===date);if(same.length)w.push(`Same day as ${same.map(x=>x.id).join(', ')} in ${d.area}`);
 const wk=weekStart(date),n=oth.filter(x=>weekStart(eff(x))===wk).length;if(n>=S.settings.maxPerWeek)w.push(`${d.area} already has ${n} drills that week (limit ${S.settings.maxPerWeek})`);
 const near=oth.filter(x=>x.code===d.code&&(x.shift||'')===(d.shift||'')&&Math.abs(diffDays(eff(x),date))<S.settings.minGap);
 if(near.length)w.push(`Less than ${S.settings.minGap} days from ${near[0].id} (${fmt(eff(near[0]))})`);
 return{e,w}}
const warns=d=>eff(d)&&!['Completed'].includes(d.status)?check(d,eff(d),'plan').w.concat(eff(d)<d.start||eff(d)>d.end?['Outside its required period']:[]):[];

function facts(t){t=(t||'').toLowerCase();const G={girl:'F',woman:'F',female:'F',boy:'M',man:'M',male:'M'};

function checkScript(d){const s=d.script,e=[],w=[];
 if(!s.story||s.story.length<30)e.push('Write the scenario story (a sentence or two at least)');

 if(S.settings.hvaRequired&&!s.hva)e.push('Link the script to a ranked hazard (HVA) - required by setting');
 if(!s.events.length)e.push('Add the event list');
 s.events.forEach((x,i)=>{if(!x.event.trim())e.push(`Event ${i+1}: describe what happens`);if(!x.role)e.push(`Event ${i+1}: pick a role`);
  else if(!s.roles.some(r=>r.role===x.role))w.push(`Event ${i+1}: role "${x.role}" is not in the roles table`);if(!x.expected.trim())w.push(`Event ${i+1}: no expected action`)});
 for(let i=1;i<s.events.length;i++)if(+s.events[i].t<+s.events[i-1].t)w.push(`Event ${i+1} is earlier than event ${i}; minutes should go forward`);
 ['Drill controller','Evaluator / observer'].forEach(r=>{if(!s.roles.some(x=>x.role===r&&x.badge))e.push(`Assign a person as ${r}`)});
 s.roles.forEach(r=>{if(!r.badge&&!['Drill controller','Evaluator / observer'].includes(r.role))w.push(`No person assigned to ${r.role}`)});
 const F=facts(s.story),gn=g=>g==='F'?'female':'male';
 s.events.forEach((x,i)=>{const f=facts(x.event+' '+x.expected);
  f.ages.forEach(a=>{if(F.ages.length&&!F.ages.includes(a))w.push(`Story vs event ${i+1}: event says ${a}-year-old, story says ${F.ages.join(', ')}-year-old`)});
  [...new Set(f.gen)].forEach(g=>{if(F.gen.length&&!F.gen.includes(g))w.push(`Story vs event ${i+1}: event says ${gn(g)}, story says ${gn(F.gen[0])}`)});
  f.locs.forEach(l=>{if(F.locs.length&&!F.locs.includes(l))w.push(`Story vs event ${i+1}: event mentions ${l}, story is in ${F.locs.join(', ')}`)})});
 return{e,w:[...new Set(w)]}}

 if(S.role==='admin'){if(k.aLate)todo.push([`${k.aLate} After Action Report(s) are past due and not signed.`,`<button class="btn" onclick="UI.rf='late';A.go('reports')">Open reports</button>`]);

function pDay(){const due=S.drills.filter(isDue).sort((a,b)=>a.current<b.current?-1:1),
 up=S.drills.filter(d=>d.status==='Scheduled'&&d.current>S.demoDate&&d.current<=addDays(S.demoDate,14)).sort((a,b)=>a.current<b.current?-1:1),

 const row=(d,btn)=>`<tr><td class="mono">${d.id}</td><td>${cdot(d.code)}${code(d.code).name}</td><td>${area(d.area).name}</td><td>${fmtd(d.current)}</td><td>${d.script?chip(d.script.status):'<span class="muted">No script yet</span>'}</td><td>${btn}</td></tr>`;

 <div class="card"><h2>Next 14 days (${up.length})</h2>${up.length?`<div class="tbl"><table>${head}<tbody>${up.map(d=>row(d,`<button class="btn sm" onclick="A.setDate0('${d.current}');A.openRun('${d.id}')">Jump to this day</button>`)).join('')}</tbody></table></div>`:'<p class="muted">None.</p>'}</div>
 <div class="card"><h2>Recently recorded</h2>${recent.length?`<div class="tbl"><table><thead><tr><th>Drill</th><th>Code</th><th>Area</th><th>Date</th><th>Result</th><th>Participants</th><th>Findings</th><th></th></tr></thead><tbody>
 ${recent.map(d=>`<tr><td class="mono">${d.id}</td><td>${cdot(d.code)}${code(d.code).name}</td><td>${area(d.area).name}</td><td>${fmtd(d.run.date)}</td><td>${chip(d.run.result==='Completed'?'Completed':'Redo required')}</td><td>${d.run.participants.length}</td><td>${d.run.findings.length}${d.run.findings.some(f=>f.gap)?` <span class="w">${d.run.findings.filter(f=>f.gap).length} gap</span>`:''}</td><td><button class="btn sm" onclick="UI.rid='${d.id}';A.go('run')">View</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No drill recorded yet.</p>'}</div>`}
STC['Met']='c-ok';STC['Partly']='c-warn';STC['Not met']='c-err';STC['N/A']='c-grey';STC.Requested='c-grey';STC['Not completed']='c-err';STC.Postponed='c-warn';
function partSearch(id){const el=document.getElementById('ps');if(!el)return;const q=UI.pq.toLowerCase().trim(),d=drill(id);
 if(!q){el.innerHTML='';return}const hits=STAFF.filter(s=>(s.badge+' '+s.name).toLowerCase().includes(q)&&!d.run.participants.includes(s.badge)).slice(0,8);
 el.innerHTML=hits.map(s=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span><span class="mono">${s.badge}</span> ${s.name} <span class="muted">${s.job} · ${esc(dept(s.dept).name)}</span></span><button class="btn sm" onclick="A.rAdd('${id}','${s.badge}')">Add</button></div>`).join('')||'<div class="muted">No match</div>'}
function pRun(){const d=drill(UI.rid);if(!d||!d.run)return'<p>No drill-day record.</p>';const r=d.run,ro=!!r.result||!canRecord(d),id=d.id,cl=checklist(d.code),items=cl.flatMap(s=>s.items),
 answered=items.filter(i=>r.checks[i.k]&&r.checks[i.k].v).length,byDept={};r.participants.forEach(b=>{const p=staff(b);if(p)byDept[p.dept]=(byDept[p.dept]||0)+1});

 return`<div class="row noprint" style="margin-bottom:10px"><button class="btn sm" onclick="A.go('day')">← Drill day</button>${d.script?`<button class="btn sm" onclick="A.openScript('${id}')">View script</button>`:''}<button class="btn sm" onclick="A.open('${id}')">Drill record</button></div>

 <p class="sub"><span class="mono">${id}</span> · ${fmtd(r.date||d.current)}${d.script&&d.script.location?' · '+esc(d.script.location):''} · observer ${esc(r.observer)} ${r.result?chip(r.result):chip('In progress')}</p>

 ${cl.map(sec=>`<div class="sec">${sec.sec}</div>${sec.items.map(i=>`<div class="ci"><div class="ct">${esc(i.t)}</div>${seg(i.k)}

 <div class="card"><h2>Participants (${r.participants.length})</h2>
 ${ro?'':`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:240px"><input id="pq" class="big" style="width:100%" placeholder="Scan or type badge number or name" value="${esc(UI.pq)}" oninput="UI.pq=this.value;partSearch('${id}')"><div id="ps"></div></div>
 <select class="big" onchange="if(this.value)A.rAddDept('${id}',this.value)"><option value="">Add a whole department…</option>${DEPTS.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`}
 <div class="muted" style="font-size:13px;margin:10px 0 6px">${Object.entries(byDept).map(([k,n])=>`${esc(dept(k).name)}: ${n}`).join(' · ')||'Nobody added yet'}</div>
 <div class="pills">${r.participants.map(b=>{const p=staff(b);return`<span class="pill">${p?p.name:b} <span class="mono muted">${b}</span>${ro?'':` <button onclick="A.rDel('${id}','${b}')" title="Remove">✕</button>`}</span>`}).join('')}</div></div>

 ${ro?'':`<div class="row" style="margin-top:10px;align-items:flex-end"><div class="field" style="flex:1;min-width:220px;margin:0"><label>Finding</label><input id="f-t" class="big" placeholder="e.g. Radio not transmitting from nurse station"></div>

 const F={all:['All',()=>true],prep:['To prepare',d=>!d.aar.sigs.length],sign:['In signature',d=>d.aar.sigs.length&&d.aar.status!=='Approved'],ok:['Approved',d=>d.aar.status==='Approved'],

 const rows=all.filter(F[rf][1]).sort((a,b)=>a.run.date<b.run.date?1:-1);
 return`<h1>After Action Reports</h1><p class="sub">Opened automatically when a drill is recorded as completed, pre-filled from the script and the drill-day record. Due ${S.settings.aarDue} days after the drill, with reminders on day 7 and day 14. Eight continuity checks must pass before the first signature, then four signatures in order: prepared, reviewed by the code reviewer, OEMC concurs, DOM approves.</p>

 (!f.type||g.type===f.type)&&(!f.owner||g.owner===f.owner)&&(!f.esc||String(g.esc)===f.esc&&g.status!=='Closed')&&(!f.q||(g.id+' '+g.drill+' '+g.text).toLowerCase().includes(f.q.toLowerCase())))

 return`<h1>Gaps</h1><p class="sub">Every item in an approved report becomes a gap with an owner, a type and a due date. Open gaps escalate at 30 days (owner), 60 days (+ department head) and 90 days (+ executives). Facility gaps create an SAP maintenance request; overdue gaps go to Datix${S.settings.datixAuto?'':' (switched off)'}. Both are mock links in the demo.</p>

 <div class="grid2"><div class="card"><h2>Overdue by owner</h2>${Object.keys(byOwner).length?bars(Object.entries(byOwner).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([o,n])=>[esc(dept(o).name),n]),'var(--err)'):'<p class="muted">None.</p>'}</div>
 <div class="card"><h2>Open by escalation level</h2>${bars([0,1,2,3].map(l=>[l?ESC[l]:'Under 30 days',open.filter(g=>g.esc===l).length]),'var(--purple)')}</div></div>
 <div class="filters">${sel('status',[['open','Open (all)'],['Open','Open, not started'],['In progress','In progress'],['overdue','Overdue'],['Closed','Closed']],'All statuses')}${sel('type',GAP_TYPES.map(t=>[t,t]),'All types')}
 ${sel('owner',DEPTS.filter(o=>S.gaps.some(g=>g.owner===o.id)).map(o=>[o.id,o.name]),'All owners')}${sel('esc',[['1','30+ days'],['2','60+ days'],['3','90+ days']],'Any escalation')}
 <input placeholder="Search gap, drill or text" value="${esc(f.q)}" onchange="UI.gf.q=this.value;render()"><button class="btn sm" onclick="A.download('gaps')">Download CSV</button></div>
 <div class="muted" style="font-size:13px;margin-bottom:6px">${rows.length} gaps</div>
 <div class="tbl"><table><thead><tr><th>Gap</th><th class="wrap">Description</th><th>Type</th><th>Owner</th><th>Created</th><th>Due</th><th>Status</th><th>Escalation</th><th>Links</th></tr></thead><tbody>
 ${rows.slice(0,200).map(g=>{const ov=g.status!=='Closed'&&g.due<S.demoDate;return`<tr class="click" onclick="A.openGap('${g.id}')"><td class="mono">${g.id}</td><td class="wrap" style="min-width:240px">${esc(g.text)}<div class="muted mono" style="font-size:12px">${g.drill}</div></td><td>${g.type}</td><td>${esc(dept(g.owner).name)}</td>
 <td>${fmt(g.created)}</td><td class="${ov?'e':''}">${fmt(g.due)}</td><td>${chip(ov?'Overdue':g.status)}</td><td>${g.status==='Closed'?'':g.esc?`<span class="chip ${g.esc>=3?'c-err':g.esc===2?'c-warn':'c-grey'}">${[30,60,90][g.esc-1]}+ days</span>`:''}</td>
 <td class="mono" style="font-size:12px">${g.maint?g.maint.no:''}${g.maint&&g.datix?'<br>':''}${g.datix||''}</td></tr>`}).join('')||'<tr><td colspan="9" class="muted">No gaps match.</td></tr>'}</tbody></table></div>`}

 ${g.datix?`<dt>Datix</dt><dd><span class="mono">${g.datix}</span> <span class="muted">(mock)</span></dd>`:''}</dl>

 ${own&&g.maint&&g.maint.status!=='Completed'?`<button class="btn" onclick="A.gMaint('${g.id}')">Simulate SAP update</button>`:''}<button class="btn" onclick="A.modal('gnote','${g.id}')">Add note</button></div>

function pKPI(){const k=kpi(),ds=S.drills;const T=(lbl,v,h,good)=>`<div class="tile ${good===undefined?'':good?'good':'bad'}"><div class="k">${lbl}</div><div class="v">${v}</div><div class="h">${h}</div></div>`;
 const months=MON.map((m,i)=>{const mm=pad(i+1),pl=ds.filter(d=>(d.original||d.planned||'').slice(5,7)===mm).length,dn=ds.filter(d=>d.status==='Completed'&&d.doneDate.slice(5,7)===mm).length;return[m,pl,dn]});
 const mx=Math.max(1,...months.map(m=>m[1]));const byType={};S.gaps.forEach(g=>{byType[g.type]=byType[g.type]||[0,0];byType[g.type][g.status==='Closed'?0:1]++});
 return`<h1>KPI dashboard</h1><div class="note">In production this page is a SAP Analytics Cloud story on Datasphere (UC15, UC17), fed by the same records. Here it is computed in the browser. Demo date ${fmtd(S.demoDate)}.</div>
 <div class="kpis">${T('Planned vs required',pct(k.dated,k.required),`${k.dated} of ${k.required} (UC2)`)}${T('Done vs planned to date',pct(k.comp,k.due),`${k.comp} of ${k.due} (UC2)`,k.due?k.comp/k.due>=.9:undefined)}
 ${T('Held on approved date',pct(k.held,k.comp),'target above 90% (UC3)',k.comp?k.held/k.comp>=.9:undefined)}${T('Scripts approved on time',pct(k.sOnTime,k.sAppr),`${k.sRounds} review rounds avg (UC4)`,k.sAppr?k.sOnTime/k.sAppr>=.9:undefined)}
 ${T('Staff in at least 1 drill',pct(k.staffIn,STAFF.length),`${k.staffIn} of ${STAFF.length} (UC5)`)}${T('Reports on time',pct(k.aOnTime,k.aBase),`${k.aDays} days to final approval (UC6)`,k.aBase?k.aOnTime/k.aBase>=.9:undefined)}
 ${T('Gaps closed',pct(k.gClosed,k.gAll),`target above 80% · ${k.gOver} overdue (UC7)`,k.gAll?k.gClosed/k.gAll>=.8:undefined)}${T('Open over 90 days',k.gL3,'escalated to executives (UC7)',k.gL3===0)}</div>
 <div class="card"><h2>Drills by month: approved plan vs completed</h2><div class="cols">${months.map(([m,p,d])=>`<div class="col"><div class="cb"><div class="c1" style="height:${p/mx*100}%" title="${p} planned"></div><div class="c2" style="height:${d/mx*100}%" title="${d} completed"></div></div><div class="cl">${m}</div></div>`).join('')}</div>
 <div class="row muted" style="font-size:13px;margin-top:8px"><span><span class="dot" style="background:var(--ice)"></span>Planned</span><span><span class="dot" style="background:var(--blue)"></span>Completed</span></div></div>
 <div class="grid2"><div class="card"><h2>Gaps by type</h2>${bars(GAP_TYPES.map(t=>[t,(byType[t]||[0,0])[1],` open · ${(byType[t]||[0,0])[0]} closed`]),'var(--warn)')}</div>
 <div class="card"><h2>Report status</h2>${bars(['Draft','Returned','Prepared','Reviewed','Concurred','Approved'].map(s=>[s,ds.filter(d=>d.aar&&d.aar.status===s).length]),'var(--purple)')}</div></div>
 <div class="card"><h2>By area</h2><div class="tbl"><table><thead><tr><th>Area</th><th>Drills</th><th>Done to date</th><th>Held on date</th><th>Scripts on time</th><th>Reports on time</th><th>Open gaps</th><th>Overdue gaps</th></tr></thead><tbody>
 ${AREAS.map(a=>{const x=ds.filter(d=>d.area===a.id),due=x.filter(d=>eff(d)&&eff(d)<=S.demoDate&&d.original),c=x.filter(d=>d.status==='Completed'),sa=x.filter(d=>d.script&&d.script.status==='Approved'),

  return`<tr><td><b>${a.id}</b> <span class="muted">${a.name}</span></td><td>${x.length}</td><td>${pct(c.length,due.length)}</td><td>${pct(c.filter(d=>d.doneDate===d.original).length,c.length)}</td>
  <td>${pct(sa.filter(d=>d.script.approvedAt<=d.script.due).length,sa.length)}</td><td>${pct(ap.filter(d=>d.aar.sigs[0].at.slice(0,10)<=d.aar.due).length,ap.length)}</td><td>${g.length}</td><td>${g.filter(x=>x.due<S.demoDate).length}</td></tr>`}).join('')}</tbody></table></div></div>`}

function pGuide(){return`<h1>How to use this demo</h1><p class="sub">The app follows one drill from the yearly plan to closed gaps. Nothing to install and no sign-in. Below: how to start, a 10-minute tour, then each page on its own.</p>

 <li><b>View as</b> (top bar): pick the role you want to play. Each role sees its own to-do list and buttons.</li>
 <li><b>Dept</b> (top bar, for Proponent and Gap owner): pick the department.</li>
 <li><b>Demo date</b> (top bar): moves time forward, so reminders, escalations and due drills appear.</li>
 <li><b>Reset</b> (top bar): brings back the sample data. Your changes stay only in this browser.</li>
 <li>On <b>Overview</b>: <b>Start planning</b> (empty year, 1 Dec 2025) or <b>Load mid-year</b> (15 Jul 2026).</li></ol></div>
 <div class="card"><h2>The seven roles</h2><div class="tbl"><table><tbody>
 <tr><td><b>EPPU admin</b></td><td class="wrap">Generates and submits the plan, sends the MOH copy, follows KPIs</td></tr>
 <tr><td><b>Proponent</b></td><td class="wrap">Department head: picks dates, writes scripts, prepares reports</td></tr>
 <tr><td><b>OEMC reviewer</b></td><td class="wrap">Approves the plan, change requests and scripts; concurs on reports</td></tr>
 <tr><td><b>Observer</b></td><td class="wrap">Records the drill on drill day</td></tr>
 <tr><td><b>Code reviewer (AAR)</b></td><td class="wrap">Reviews the report for the drill’s colour code</td></tr>
 <tr><td><b>DOM approver</b></td><td class="wrap">Gives the final report approval</td></tr>
 <tr><td><b>Gap owner / CPH</b></td><td class="wrap">Works and closes the gaps of a department</td></tr></tbody></table></div></div></div>
 <div class="card"><h2>A 10-minute tour</h2><ol class="list">
 <li><b>Plan</b> (2 min): Start planning, view as EPPU admin, Generate 2026 slots, Suggest dates, open Annual plan.</li>

function pAbout(){return`<h1>About this demo</h1><p class="sub">The complete drill lifecycle app, cases 2 to 7: the annual schedule (UC2), change control (UC3), master lists (UC19), the drill script (UC4), drill day (UC5), the After Action Report (UC6) and gaps (UC7), plus a KPI dashboard and the handover pack for SAP at the bottom of this page.</p>
 <div class="card"><h2>Step 3 walkthrough</h2><ol class="list">
 <li>Press <b>Load mid-year</b> on Overview (demo date 15 Jul 2026), then open the <b>KPI dashboard</b>.</li>
 <li>As <b>Proponent</b>, open After Action Reports, pick one to prepare, rate the objectives, use "Add missing items from drill day" and sign. All 8 continuity checks must be green.</li>
 <li>Switch to <b>Code reviewer</b>, <b>OEMC</b> and <b>DOM approver</b> in turn and sign. Each signature is stamped with date and time. When the DOM signs, each improvement becomes a gap.</li>
 <li>Open <b>Gaps</b>: filter by overdue or 90+ days. The gap "Radio not transmitting…" from IT-DH-Y has a SAP maintenance request.</li>
 <li>Switch to <b>Gap owner / CPH</b>, pick a department and close a gap with evidence. Move the demo date forward to watch escalation and Datix referral.</li></ol></div>
 <div class="card"><h2>Business rules in step 3</h2><ol class="list">
 <li>BR-19 A report opens when a drill is recorded as completed, pre-filled from the script (objectives) and drill day (participants, findings flagged as possible gaps, strengths).</li>
 <li>BR-20 Due ${S.settings.aarDue} days after the drill (setting); reminders to the proponent on day 7 and day 14 while unsigned.</li>
 <li>BR-21 Eight continuity checks must pass before the first signature: date and participants match drill day, summary written, every objective rated, every "Not met" checklist item and every possible-gap finding in the improvement plan, every item has type and owner, at least one strength.</li>
 <li>BR-22 Four signatures in order, each with date and time: prepared (proponent), reviewed (reviewer role for the code), OEMC concurs, DOM approves. Any signer after the first can return it; returning clears all signatures.</li>
 <li>BR-23 On DOM approval each improvement becomes a gap. Due date: set on the item, or by type, or one 30-day rule (setting).</li>
 <li>BR-24 Facility gaps create an SAP maintenance request (mock). Overdue gaps go to Datix (mock, setting).</li>
 <li>BR-25 Escalation by days open: 30 → owner, 60 → + department head (CPH), 90 → + executives.</li>
 <li>BR-26 Closing a gap needs a description of what was done. EPPU can reopen. KPI: share closed, target above 80%.</li></ol></div>
 <div class="card"><h2>Step 2 walkthrough</h2><ol class="list">
 <li>Press <b>Load mid-year</b> on Overview (demo date 15 Jul 2026).</li>
 <li>As <b>Proponent</b>, open Drill scripts, pick a requested script, start from the template and edit it. Change an age or a ward in one event and watch the check flag it. Submit.</li>
 <li>As <b>OEMC</b>, open the Code Pink script in review: the check shows the story and the event list disagree on the child. Return it with comments, or approve another script.</li>
 <li>As <b>Observer</b>, open Drill day, jump to an upcoming drill, fill the checklist on a tablet, add participants by badge, log a finding as a possible gap and record the result.</li>
 <li>Open the drill <b>IT-DH-Y</b> (oxygen supply failure, April): its record has the "radio not transmitting" finding flagged for Step 3.</li></ol></div>
 <div class="card"><h2>Business rules in step 2</h2><ol class="list">
 <li>BR-11 When a drill is approved and ${S.settings.scriptLead} days away, the app requests the script from the proponent. It is due ${S.settings.scriptDue} days before the drill (settings).</li>
 <li>BR-12 A script needs a story, at least one objective, an event list with a role on each event, and a person as drill controller and as evaluator / observer. Hard stop.</li>
 <li>BR-13 The story is checked against each event: ages, male / female and ward or building names must match. Mismatches are warnings that OEMC sees.</li>
 <li>BR-14 OEMC approves or returns a script with comments; each decision is a review round. KPIs: approved on time and average rounds.</li>
 <li>BR-15 Drill day can be recorded only on or after the drill date and, by setting, only with an approved script.</li>
 <li>BR-16 Completed needs every checklist item answered, an end time and at least one participant. Not completed needs a reason and starts the redo rule (BR-09). Postponed opens a change request (BR-07).</li>
 <li>BR-17 Participants are recorded by badge from the Datasphere staff list. KPI: share of staff in at least one drill.</li>
 <li>BR-18 Findings carry one of 8 types; those marked "possible gap" go to the improvement plan in Step 3.</li></ol></div>
 <div class="card"><h2>How to walk through it</h2><ol class="list">
 <li>As <b>EPPU admin</b>, open Master lists and check the frequency rules, then generate the ${YEAR} slots from Overview.</li>
 <li>Switch to <b>Proponent</b>, pick a department and set dates in My drills. Try a Friday, Eid or a date outside the period to see the checks.</li>
 <li>Back as admin, let the app suggest the remaining dates and submit each area.</li>
 <li>As <b>OEMC</b>, approve the areas (or return one with a comment). Then, as admin, send the copy to MOH and MSMD.</li>
 <li>Move the demo date forward in the header, request a change as a proponent and approve it as OEMC. The original date stays.</li>
 <li>Or press <b>Load mid-year</b> on Overview to see KPIs with half a year of history.</li></ol></div>
 <div class="card"><h2>Business rules in this step</h2><ol class="list">
 <li>BR-01 One slot per code, area and period from the frequency table; quarterly-per-shift creates Day, Evening and Night slots.</li>
 <li>BR-02 A planned date must fall inside its required period. Hard stop.</li>
 <li>BR-03 Warnings (do not block): weekend, public holiday, Ramadan, same day as another drill in the area, more than ${S.settings.maxPerWeek} drills per area per week, less than ${S.settings.minGap} days from the same code in the area.</li>
 <li>BR-04 EPPU submits a part only when every drill in it has a date. OEMC approves or returns with a comment.</li>
 <li>BR-05 On approval the planned date becomes the original approved date and is never changed afterwards.</li>
 <li>BR-06 The copy for MOH and Aramco MSMD can be sent only when the whole plan is approved.</li>
 <li>BR-07 After approval a date changes only through a change request with a reason from the list, approved by OEMC.</li>
 <li>BR-08 Moving a drill earlier counts as off-schedule (setting). Moving it out of its period is warned.</li>
 <li>BR-09 A drill not completed must be redone in the same calendar month, after the failed date.</li>
 <li>BR-10 KPI held on approved date = completed on the original approved date ÷ completed. Target above 90%.</li></ol></div>
 <div class="card"><h2>Demo to SAP BTP</h2><div class="tbl"><table><thead><tr><th>Piece</th><th class="wrap">In the demo</th><th class="wrap">On SAP BTP</th></tr></thead><tbody>

 <tr><td>KPIs</td><td class="wrap">Overview tiles</td><td class="wrap">SAC on Datasphere (UC15, UC17)</td></tr></tbody></table></div></div>

 <h1 style="margin-top:8px">${cdot(d.code)}${c.name} · ${area(d.area).name}</h1><div>${chip(d.status)}${d.redo?' '+chip('Redo'):''}</div>
 <dl class="kv"><dt>Meaning</dt><dd>${c.meaning}</dd><dt>Required period</dt><dd>${d.label}${d.shift?' · '+d.shift+' shift':''} (${fmt(d.start)} to ${fmt(d.end)})</dd>
 <dt>Proponent</dt><dd>${esc(dept(d.dept).name)}<div class="muted">CPH: ${esc(dept(d.dept).head)}</div></dd><dt>Rule</dt><dd>${FREQ[d.freq]} in ${d.area}</dd>
 <dt>Planned date</dt><dd>${fmtd(d.planned)}</dd><dt>Original approved</dt><dd>${fmtd(d.original)}</dd><dt>Current date</dt><dd>${fmtd(d.current)}</dd>
 <dt>Changes</dt><dd>${d.changes}</dd>${d.notDoneDate?`<dt>Not completed</dt><dd>${fmt(d.notDoneDate)}: ${esc(d.notDoneReason)}</dd>`:''}${d.doneDate?`<dt>Completed</dt><dd>${fmtd(d.doneDate)} ${d.doneDate===d.original?chip('On approved date'):chip('Off approved date')}</dd>`:''}</dl>
 ${w.length?`<div class="msgs">${w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join('')}</div>`:''}
 <div class="row" style="margin:14px 0">${canEditDate(d)?`<label class="row" style="gap:8px">Date <input type="date" min="${d.start}" max="${d.end}" value="${d.planned||''}" onchange="A.setDate('${d.id}',this.value)" style="border:1px solid var(--line);border-radius:6px;padding:5px 8px"></label>`:''}
 ${canChange(d)?`<button class="btn primary" onclick="A.modal('${d.status==='Redo required'?'redo':'change'}','${d.id}')">${d.status==='Redo required'?'Request redo':'Request change'}</button>`:''}
 ${d.script?`<button class="btn" onclick="A.openScript('${d.id}')">${canEditScript(d)?'Edit script':'View script'}</button>`:''}
 ${canRun(d)?`<button class="btn primary" onclick="A.openRun('${d.id}')">Drill day</button>`:''}
 ${d.run&&d.run.result?`<button class="btn" onclick="UI.rid='${d.id}';A.go('run')">Drill-day record</button>`:''}
 ${d.aar?`<button class="btn ${canSignAAR(d)?'primary':''}" onclick="A.openAAR('${d.id}')">After Action Report</button>`:''}
 ${S.gaps.some(g=>g.drill===d.id)?`<button class="btn" onclick="UI.gf={status:'',type:'',owner:'',q:'${d.id}',esc:''};A.go('gaps')">Gaps (${S.gaps.filter(g=>g.drill===d.id).length})</button>`:''}</div>
 ${d.aar?`<dl class="kv"><dt>Report</dt><dd>${chip(d.aar.status)} due ${fmt(d.aar.due)} · ${d.aar.sigs.length} of 4 signatures</dd></dl>`:''}
 ${canRecord(d)&&!scriptOk(d)?'<p class="e" style="font-size:13px">The drill date has come but the script is not approved, so drill day cannot be recorded (setting).</p>':''}
 ${d.script?`<dl class="kv"><dt>Script</dt><dd>${chip(d.script.status)} due ${fmt(d.script.due)}${d.script.rounds.length?` · ${d.script.rounds.length} review round(s)`:''}</dd>
 ${d.run&&d.run.result?`<dt>Drill day</dt><dd>${d.run.participants.length} participants · ${d.run.findings.length} finding(s)${d.run.findings.some(f=>f.gap)?` · <span class="w">${d.run.findings.filter(f=>f.gap).length} possible gap(s)</span>`:''}</dd>`:''}</dl>`:''}
 <h2 style="margin-top:20px">History</h2><div class="hist">${d.history.slice().reverse().map(h=>`<div><div class="at">${fmt(h.at)} · ${esc(h.who)}</div>${esc(h.text)}</div>`).join('')}</div></div></div>`}
function modal(){const m=UI.modal;if(!m)return'';let h='';
 if(m.type==='change'||m.type==='redo'){const d=drill(m.id),redo=m.type==='redo';const min=addDays(S.demoDate,1);
  h=`<h2>${redo?'Request a redo':'Request a date change'} · <span class="mono">${d.id}</span></h2>
  <p class="muted">${redo?`Not completed on ${fmt(d.notDoneDate)}. The redo must be in the same month.`:`Current date ${fmtd(d.current)}. Original approved date ${fmt(d.original)} is kept.`}</p>
  <div class="field"><label>New date</label><input id="m-to" type="date" min="${min}" max="${YEAR}-12-31" oninput="liveCheck('${d.id}','${m.type}')"></div><div id="m-chk" class="msgs"></div>
  <div class="field"><label>Reason</label><select id="m-r"><option value="">Choose…</option>${REASONS.map(r=>`<option ${redo&&r.startsWith('Drill not')?'selected':''}>${r}</option>`).join('')}</select></div>
  <div class="field"><label>Comment</label><textarea id="m-c" placeholder="Optional"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn primary" onclick="A.requestChange('${d.id}',val('m-to'),val('m-r'),val('m-c'),'${m.type}')">Send to OEMC</button></div>`}
 if(m.type==='outcome'){const d=drill(m.id);h=`<h2>Record outcome · <span class="mono">${d.id}</span></h2><p class="muted">Drill date ${fmtd(d.current)}.</p>
  <div class="field"><label>Result</label><select id="m-res" onchange="document.getElementById('m-rw').style.display=this.value==='Completed'?'none':'grid'"><option>Completed</option><option>Not completed</option></select></div>
  <div class="field" id="m-rw" style="display:none"><label>Why was it not completed?</label><textarea id="m-why"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn primary" onclick="A.record('${d.id}',val('m-res'),val('m-why'))">Save</button></div>`}
 if(m.type==='areturn')h=`<h2>Return report ${m.id} to the proponent</h2><div class="field"><label>What must change? (required)</label><textarea id="m-c"></textarea></div>
  <p class="muted" style="font-size:13px">All signatures are cleared and the report goes back to Draft.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn danger" onclick="A.aReturn('${m.id}',val('m-c'))">Return</button></div>`;
 if(m.type==='gclose'||m.type==='gnote')h=`<h2>${m.type==='gclose'?'Close gap':'Add a note to'} ${m.id}</h2><div class="field"><label>${m.type==='gclose'?'What was done? (evidence, required)':'Note'}</label><textarea id="m-c"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn ${m.type==='gclose'?'ok':'primary'}" onclick="${m.type==='gclose'?`A.gStatus('${m.id}','Closed',val('m-c'))`:`A.gNote('${m.id}',val('m-c'))`}">${m.type==='gclose'?'Close gap':'Add note'}</button></div>`;
 if(m.type==='sreturn')h=`<h2>Return script ${m.id} with comments</h2><div class="field"><label>What must the proponent change? (required)</label><textarea id="m-c">${esc(drill(m.id).script.warnings.join('\n'))}</textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn danger" onclick="A.sDecide('${m.id}',false,val('m-c'))">Return</button></div>`;
 if(m.type==='return'||m.type==='reject')h=`<h2>${m.type==='return'?'Return '+unitName(m.id)+' to EPPU':'Reject '+m.id}</h2><div class="field"><label>Comment (required)</label><textarea id="m-c"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn danger" onclick="${m.type==='return'?`A.returnUnit('${m.id}',val('m-c'))`:`A.decide('${m.id}',false,val('m-c'))`}">${m.type==='return'?'Return':'Reject'}</button></div>`;
 return`<div class="modalwrap" onclick="if(event.target===this){UI.modal=null;render()}"><div class="modal">${h}</div></div>`}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function liveCheck(id,mode){const v=val('m-to'),el=document.getElementById('m-chk');if(!v){el.innerHTML='';return}const r=check(drill(id),v,mode);
 el.innerHTML=r.e.map(x=>`<div class="e">✕ ${esc(x)}</div>`).join('')+r.w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join('')+(!r.e.length&&!r.w.length?'<div class="ok">✓ No conflicts found</div>':'')}

/* ---------- Shell ---------- */
const PAGES=[['Work',[['overview','Overview'],['kpi','KPI dashboard'],['plan','Annual plan'],['approvals','Approvals'],['changes','Change control'],['moh','MOH / MSMD copy'],['scripts','Drill scripts'],['day','Drill day'],['reports','After Action Reports'],['gaps','Gaps']]],
 ['Data',[['master','Master lists'],['emails','Email log']]],['Help',[['guide','How to use'],['about','About this demo']]]];
function render(){const n=counts();const props=[...new Set(S.drills.length?S.drills.map(d=>d.dept):CODES.flatMap(c=>AREAS.map(a=>proponentFor(c.id,a.id))))];
 if(UI.page==='data')UI.page='overview';
 const page={overview:pOverview,plan:pPlan,approvals:pApprovals,changes:pChanges,moh:pMOH,scripts:pScripts,script:pScript,day:pDay,run:pRun,reports:pReports,aar:pAAR,gaps:pGaps,kpi:pKPI,master:pMaster,emails:pEmails,about:pAbout,guide:pGuide}[UI.page]();
 document.getElementById('app').innerHTML=`<header class="shell"><div class="brand"><svg class="sap" viewBox="0 0 92 45.4" role="img" aria-label="SAP"><defs><linearGradient id="sapg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00B8F1"/><stop offset=".22" stop-color="#06A5E5"/><stop offset=".79" stop-color="#1870C5"/><stop offset="1" stop-color="#1D61BC"/></linearGradient></defs><path d="M0 45.4h46.4L91.8 0H0z" fill="url(#sapg)"/><text x="7" y="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24" fill="#fff" letter-spacing="-.5">SAP</text></svg><span class="sep"></span>EPPU Drill Manager</div><span class="demo-tag">Demo · sample data</span><span class="sp"></span>
 <label>View as <select onchange="A.setRole(this.value)">${Object.entries(ROLE_NAMES).map(([k,l])=>`<option value="${k}" ${S.role===k?'selected':''}>${l}</option>`).join('')}</select></label>
 ${S.role==='proponent'||S.role==='owner'?`<label>Dept <select onchange="A.setDept(this.value)">${DEPTS.filter(d=>S.role==='owner'?(!S.gaps.length||S.gaps.some(g=>g.owner===d.id)):props.includes(d.id)).map(d=>`<option value="${d.id}" ${S.dept===d.id?'selected':''}>${esc(d.name)}${S.role==='owner'?` (${S.gaps.filter(g=>g.owner===d.id&&g.status!=='Closed').length} open)`:''}</option>`).join('')}</select></label>`:''}
 <label>Demo date <input type="date" value="${S.demoDate}" onchange="A.setDate0(this.value)"></label>
 <button class="btn sm" onclick="A.reset(S.demoDate>'2026-01-01'?'mid':'fresh')" title="Restore the sample data in this browser">Reset</button></header>
 <div class="layout"><nav>${PAGES.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,l])=>`<button class="${UI.page===k?'on':''}" onclick="A.go('${k}')"><span>${l}</span>${(b=>b?`<span class="badge">${b}</span>`:'')({approvals:n.appr,scripts:n.scripts,day:n.day,reports:n.reports,gaps:n.gaps}[k])}</button>`).join('')).join('')}</nav>
 <main>${page}</main></div>${drawer()}${gapDrawer()}${modal()}`;
 renderTable()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.drawer||UI.modal||UI.gap))A.close()});
render();
