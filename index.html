<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPPU Drill Manager · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#00123B;--blue:#2A66DD;--cyan:#1DC8DF;--purple:#753BBD;--ice:#CED9E5;--bg:#F4F6F9;--surface:#fff;--ink:#0B1630;--muted:#5A6782;--line:#DCE3EC;
--ok:#1E7A4F;--okbg:#E4F3EB;--warn:#94600F;--warnbg:#FCF1DC;--err:#B42727;--errbg:#FBE8E8;--info:#1F4FB0;--infobg:#E6EEFC;--pur:#5B2D96;--purbg:#EFE7F9;--grey:#4A556B;--greybg:#EBEEF3;
--font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.shell{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 13px var(--mono)}
.demo-tag{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(29,200,223,.18);color:var(--cyan);padding:5px 8px;border-radius:4px;white-space:nowrap}
.shell .sp{flex:1}
.shell label{font-size:12px;color:#B9C6DA;display:flex;align-items:center;gap:6px}
.shell select,.shell input{background:#0E2552;border:1px solid #29427A;color:#fff;border-radius:6px;padding:5px 8px;font-size:13.5px}
.shell .btn{background:transparent;border-color:#3A5491;color:#fff}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg);color:var(--ink)}
nav button.on{background:var(--infobg);color:var(--info);font-weight:600}
nav .grp{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8C97AD;padding:14px 12px 6px}
.badge{background:var(--err);color:#fff;border-radius:10px;font:600 11px/1 var(--mono);padding:3px 7px}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:24px;line-height:1.25;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 20px;max-width:80ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1F55C2}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:#E9B9B9}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k{font:500 11.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:28px;font-weight:700;line-height:1.2;margin-top:6px}
.tile .h{font-size:13px;color:var(--muted)}
.tile.good .v{color:var(--ok)} .tile.bad .v{color:var(--err)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap,th.wrap{white-space:normal}
th{font:600 11.5px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#F8FAFC;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:#F6F9FE}
.chip{display:inline-block;font:500 12px/1.7 var(--mono);padding:0 8px;border-radius:4px;white-space:nowrap}
.c-grey{background:var(--greybg);color:var(--grey)}.c-info{background:var(--infobg);color:var(--info)}.c-pur{background:var(--purbg);color:var(--pur)}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-err{background:var(--errbg);color:var(--err)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.w{color:var(--warn);font-weight:600}.e{color:var(--err);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input,.field input,.field select,.field textarea,td input[type=date],td select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;font-size:14px}
td input[type=date]{padding:3px 6px}
.note{border-left:3px solid var(--cyan);background:#F0FBFD;padding:10px 14px;border-radius:0 6px 6px 0;color:#1E4E5C;margin-bottom:16px;max-width:90ch}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed #9DB3D6;border-radius:8px;padding:12px 16px;margin-bottom:18px}
.todo{display:grid;gap:8px}
.todo .it{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.list{margin:0;padding-left:18px}.list li{margin:3px 0}
.heat td{text-align:center;padding:6px 4px;font:500 12.5px var(--mono)}
.heat td:first-child{text-align:left;padding-left:12px}
.overlay{position:fixed;inset:0;background:rgba(0,18,59,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:22px 24px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.modalwrap{position:fixed;inset:0;background:rgba(0,18,59,.4);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px 24px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.field{display:grid;gap:4px;margin:12px 0}
.field label{font-size:13px;font-weight:600}
.field textarea{min-height:70px}
.hist{border-left:2px solid var(--line);margin:8px 0 0 4px;padding-left:14px;display:grid;gap:8px;font-size:13.5px}
.hist .at{font:12px var(--mono);color:var(--muted)}
.msgs{display:grid;gap:4px;margin:8px 0}
.msgs div{font-size:13.5px;padding:6px 10px;border-radius:5px}
.msgs .e{background:var(--errbg)}.msgs .w{background:var(--warnbg)}.msgs .ok{background:var(--okbg);color:var(--ok)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.email{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px;background:#fff}
.email .meta{font:12px var(--mono);color:var(--muted)}
.sec{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.ci{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.ct{flex:1;min-width:220px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:10px 14px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:14px;min-width:64px}
.seg button:last-child{border-right:0}
.seg .on-Met{background:var(--okbg);color:var(--ok)}.seg .on-Partly{background:var(--warnbg);color:var(--warn)}.seg .on-Notmet{background:var(--errbg);color:var(--err)}.seg .on-NA{background:var(--greybg);color:var(--grey)}
.big{font-size:15px!important;padding:9px 10px!important;border:1px solid var(--line);border-radius:6px;background:#fff}
.btn.big{padding:12px 20px;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--infobg);color:var(--info);border-radius:14px;padding:4px 6px 4px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.pill button{all:unset;cursor:pointer;padding:0 6px;color:var(--muted)}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav .grp{display:none}nav button{white-space:nowrap}main{padding:18px 16px 60px}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
@media print{.shell,nav,.noprint{display:none!important}.layout{display:block}main{padding:0}.card,.tbl{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>

/* ---------- Sample "Datasphere" master data (read-only) ---------- */

 ['SFP','Safety & Fire Protection','DH','Hamad Al-Dawsari'],['EVS','Environmental Services','DH','Grace Mendoza'],

const LOCAL={AH:'AHN',RT:'RTH',UD:'UDC',AB:'ABC',RAC:'RAC'};

 BROWN:{DH:'EVS',AH:'AHF',RT:'RTF'},ORANGE:{DH:'ED',AH:'AHE'},YELLOW:{DH:'SEC',AH:'AHE'},GREY:{DH:'SEC',AH:'AHN'},
 SILVER:{DH:'SEC',AH:'AHE'},GREEN:{DH:'FAC',AH:'AHF'},IT:{DH:'ITS',AH:'ITS',RT:'ITS',UD:'ITS',AB:'ITS',RAC:'ITS'}};
const proponentFor=(c,a)=>(CODE_PROP[c]&&CODE_PROP[c][a])||LOCAL[a]||'SFP';
const REASONS=['Clinical surge / high census','Staff shortage','Clash with another event or audit','Facility or equipment not available','Request from department head','Weather','Drill not completed - redo','Other'];

const LOCS={DH:['Ward 3B','Ward 4A','Pod C','Building 61'],AH:['Ward 2A','Ward 1C'],RT:['Wing A'],UD:['Wing B'],AB:['Wing A'],RAC:['Building 7']};

const ROLES=['Incident commander','Drill controller','Evaluator / observer','Simulator (actor)','Unit charge nurse','Responding team','Security officer','Facilities technician','Switchboard','Safety officer'];

const CHK_GENERIC=[['Activation',['Code called correctly and promptly','Page / notification heard in all affected areas']],

 ['Safety',['Patients and staff kept safe during the drill','Exits and corridors kept clear']],

const CHK_CODE={RED:['RACE followed','Correct extinguisher used (PASS)','Fire doors closed'],BLUE:['CPR started within 1 minute','Defibrillator applied within 3 minutes','Code team arrived within 5 minutes'],

 ORANGE:['Triage area set up','Triage tags used','Extra staff called in'],YELLOW:['Bomb threat checklist completed by call taker','Search done with radios off near the item','Police notified'],
 GREY:['Security arrived within 5 minutes','De-escalation attempted','Others moved to safety'],SILVER:['Run-hide-fight message announced','Affected zone locked down','Police notified'],
 GREEN:['Evacuation route used','Headcount at assembly point','Patients moved with their records'],IT:['Downtime / backup procedure started','Backup supply or paper forms available','Facilities and IT notified']};
function checklist(c){const l=[...CHK_GENERIC.slice(0,1),['Response',CHK_CODE[c]],...CHK_GENERIC.slice(1)];let n=0;return l.map(([sec,items])=>({sec,items:items.map(t=>({k:'i'+(++n),t}))}))}
/* Scenario templates (HSEEP-style story + event list), filled per drill */
function tpl(d){const h=hash(d.id),L=LOCS[d.area],loc=L[h%L.length],age=3+h%7,kid=['girl','boy'][h%2],adult=['man','woman'][h%2],aage=38+h%30,sh=d.shift?d.shift.toLowerCase()+' shift':'day shift',
 E=(t,event,expected,role)=>({t,event,expected,role});
 const T={
 RED:{hva:'Internal fire',story:`Smoke is reported from a linen cart in the corridor of ${loc} during the ${sh}. A nurse sees it and pulls the fire alarm.`,obj:['Staff follow RACE within 2 minutes','Fire doors closed and corridor cleared','Horizontal evacuation of 4 patients'],
  ev:[E(0,`Simulator places a smoke card on the linen cart in ${loc}`,'Nurse raises the alarm and calls the switchboard','Simulator (actor)'),E(1,`Switchboard pages Code Red ${loc}`,'Staff apply RACE and close doors','Switchboard'),E(3,'Fire team arrives','Assess and use the extinguisher (PASS)','Responding team'),E(6,'Controller: smoke spreads to the next room','Move 4 patients to the next compartment','Unit charge nurse'),E(9,'Visitors try to enter the corridor','Security keeps the area closed','Security officer'),E(14,'Fire reported out','All clear paged and headcount done','Incident commander')]},
 BLUE:{hva:'Mass casualty incident',story:`A ${aage}-year-old ${adult} visiting ${loc} collapses in the waiting area and is unresponsive with no pulse.`,obj:['CPR within 1 minute','Defibrillator within 3 minutes','Handover to the code team'],
  ev:[E(0,`Simulator: the ${adult} collapses in the waiting area of ${loc}`,'Staff check response and call Code Blue','Simulator (actor)'),E(1,'Code Blue paged','CPR started, crash cart brought','Unit charge nurse'),E(3,'Code team arrives','Team leader takes over','Responding team'),E(4,'Monitor shows a shockable rhythm','Shock given, CPR resumed','Responding team'),E(10,'Pulse returns (simulated)','Transfer to ED arranged','Incident commander'),E(15,'End of drill','Hot debrief','Drill controller')]},
 PINK:{hva:'Infant or child abduction',story:`A mother reports that her ${age}-year-old ${kid} is missing from ${loc} at 10:15. The ${kid} was last seen near the play corner.`,obj:['Exits locked within 5 minutes','Description shared to all posts','Child found and identity confirmed'],
  ev:[E(0,`Simulator (mother) tells the nurse her ${age}-year-old ${kid} is missing`,'Nurse calls Code Pink with a description','Simulator (actor)'),E(1,'Code Pink paged','All exits staffed, no one leaves with a child','Security officer'),E(4,`Security shares the description: ${age}-year-old ${kid} in a red shirt`,'All posts confirm they received it','Security officer'),E(8,'CCTV shows the child near the east stairwell','Search team sent to the stairwell','Incident commander'),E(12,'Child found with a visitor','Identity checked with the mother','Unit charge nurse'),E(15,'All clear','Debrief','Drill controller')]},
 BROWN:{hva:'Hazardous material spill',story:`A 5-litre container of formalin breaks in the corridor of ${loc}. Two staff report eye irritation.`,obj:['Area isolated quickly','Spill kit used correctly','Exposed staff sent for assessment'],
  ev:[E(0,`Simulator drops a marked container in ${loc}`,'Staff move away and call Code Brown','Simulator (actor)'),E(2,'Code Brown paged','Area isolated, ventilation checked','Unit charge nurse'),E(5,'Spill team arrives','Safety data sheet checked, spill kit used','Responding team'),E(10,'Two staff report eye irritation','Eye wash and referral to ED','Safety officer'),E(16,'Spill cleaned','Waste bagged and labelled; all clear','Incident commander')]},
 ORANGE:{hva:'Mass casualty incident',story:`A bus accident on the highway near ${area(d.area).name}: 12 casualties are expected within 20 minutes.`,obj:['Triage area ready before the first patient','Extra staff called in','Bed status reported'],
  ev:[E(0,'Switchboard receives the alert from the Red Crescent','Code Orange activated','Switchboard'),E(3,'Incident command post opened','Roles handed out with action cards','Incident commander'),E(10,'Triage area ready at the entrance','Triage tags available','Responding team'),E(20,'First 4 casualties arrive (actors)','Triage and treatment areas used','Simulator (actor)'),E(35,'Bed and staff status requested','Report sent to command post','Unit charge nurse'),E(50,'Last casualty treated','Stand down and debrief','Drill controller')]},
 YELLOW:{hva:'Bomb threat',story:`The switchboard receives a phone call saying a bomb has been placed in ${loc}.`,obj:['Bomb threat checklist completed','Search done safely','Police notified'],
  ev:[E(0,'Simulator calls the switchboard with the threat','Call taker completes the checklist','Simulator (actor)'),E(2,'Code Yellow paged','Staff search their own area, radios off','Unit charge nurse'),E(8,'Suspicious bag found','Area cleared, no one touches it','Security officer'),E(12,'Police informed (simulated)','Cordon kept','Incident commander'),E(20,'Bag cleared (simulated)','All clear','Drill controller')]},

/* ---------- Date helpers (ISO yyyy-mm-dd, UTC) ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=t=>t.toISOString().slice(0,10);
const addDays=(s,n)=>{const t=D(s);t.setUTCDate(t.getUTCDate()+n);return iso(t)};
const dow=s=>D(s).getUTCDay();
const diffDays=(a,b)=>Math.round((D(b)-D(a))/864e5);
const weekStart=s=>addDays(s,-dow(s)); /* KSA working week starts Sunday */
const fmt=s=>s?`${+s.slice(8)} ${MON[+s.slice(5,7)-1]} ${s.slice(0,4)}`:'—';
const fmtd=s=>s?`${DOWN[dow(s)]} ${fmt(s)}`:'—';
const pad=n=>String(n).padStart(2,'0');
const monthEnd=m=>iso(new Date(Date.UTC(YEAR,m,0)));
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function periods(f){const o=[];
 if(f==='M')for(let m=1;m<=12;m++)o.push({key:`${YEAR}-${pad(m)}`,label:`${MON[m-1]} ${YEAR}`,start:`${YEAR}-${pad(m)}-01`,end:monthEnd(m)});
 if(f==='Q'||f==='Q3')for(let q=1;q<=4;q++){const p={key:`${YEAR}Q${q}`,label:`Q${q} ${YEAR}`,start:`${YEAR}-${pad(q*3-2)}-01`,end:monthEnd(q*3)};
  if(f==='Q')o.push(p);else['Day','Evening','Night'].forEach(sh=>o.push({...p,shift:sh}))}
 if(f==='H'){o.push({key:`${YEAR}H1`,label:`H1 ${YEAR}`,start:`${YEAR}-01-01`,end:`${YEAR}-06-30`});o.push({key:`${YEAR}H2`,label:`H2 ${YEAR}`,start:`${YEAR}-07-01`,end:`${YEAR}-12-31`})}
 if(f==='Y')o.push({key:`${YEAR}`,label:`Year ${YEAR}`,start:`${YEAR}-01-01`,end:`${YEAR}-12-31`});
 return o}

/* ---------- Business rules: date check ---------- */
function check(d,date,mode='plan'){const e=[],w=[];
 if(!date)return{e:['Pick a date'],w};
 if(date.slice(0,4)!==String(YEAR))e.push(`Date must be in ${YEAR}`);
 const inWin=date>=d.start&&date<=d.end;
 if(mode==='plan'&&!inWin)e.push(`Outside the required period (${fmt(d.start)} to ${fmt(d.end)})`);
 if(mode==='change'&&!inWin)w.push(`Moves out of its required period (${d.label}); that period's mandatory drill would be missed`);
 if(mode==='redo'){const m=d.notDoneDate.slice(0,7);if(date.slice(0,7)!==m)e.push(`A redo must be in the same month (${MON[+m.slice(5)-1]})`);if(date<=d.notDoneDate)e.push('A redo must be after the drill that was not completed')}
 if(mode!=='plan'&&date<=S.demoDate)e.push(`Must be after today (demo date ${fmt(S.demoDate)})`);
 if(mode==='change'&&d.original&&date<d.original&&S.settings.earlierOff)w.push('Earlier than the approved date: counts as off-schedule (setting)');
 const wd=dow(date);if(wd===5||wd===6)w.push(`${DOWN[wd]} is a weekend day`);
 const h=holiday(date);if(h)w.push(`Public holiday: ${h}`);
 if(inRamadan(date))w.push('During Ramadan (reduced working hours)');
 const oth=S.drills.filter(x=>x.id!==d.id&&x.area===d.area&&eff(x));
 const same=oth.filter(x=>eff(x)===date);if(same.length)w.push(`Same day as ${same.map(x=>x.id).join(', ')} in ${d.area}`);
 const wk=weekStart(date),n=oth.filter(x=>weekStart(eff(x))===wk).length;if(n>=S.settings.maxPerWeek)w.push(`${d.area} already has ${n} drills that week (limit ${S.settings.maxPerWeek})`);
 const near=oth.filter(x=>x.code===d.code&&(x.shift||'')===(d.shift||'')&&Math.abs(diffDays(eff(x),date))<S.settings.minGap);
 if(near.length)w.push(`Less than ${S.settings.minGap} days from ${near[0].id} (${fmt(eff(near[0]))})`);
 return{e,w}}
const warns=d=>eff(d)&&!['Completed'].includes(d.status)?check(d,eff(d),'plan').w.concat(eff(d)<d.start||eff(d)>d.end?['Outside its required period']:[]):[];

function canEditDate(d){if(S.planStatus==='Not started')return false;const u=unit(unitOf(d)).status;
 if(!['Draft','Returned'].includes(u)||!['Open','Date proposed'].includes(d.status))return false;
 return S.role==='admin'||(S.role==='proponent'&&d.dept===S.dept)}
const canChange=d=>(S.role==='admin'||(S.role==='proponent'&&d.dept===S.dept)||(S.role==='observer'&&d.current<=S.demoDate))&&(d.status==='Scheduled'||d.status==='Redo required');

const scriptOk=d=>!S.settings.requireScript||(d.script&&d.script.status==='Approved');

/* ---------- Business rules: scripts (UC4) ---------- */
function newScript(d){return{status:'Requested',requestedAt:S.demoDate,due:addDays(eff(d),-S.settings.scriptDue),story:'',objectives:['','',''],hva:'',location:'',map:null,roles:[],events:[],rounds:[],submittedAt:null,approvedAt:null,warnings:[]}}
function fillTemplate(d){const t=tpl(d),s=d.script;Object.assign(s,{story:t.story,objectives:t.obj.slice(),hva:t.hva,location:t.loc,events:t.ev.map(e=>({...e})),roles:t.roles.map(r=>({...r}))})}
/* Request the script N days before the drill (setting); runs whenever state changes */
function tick(){S.drills.forEach(d=>{if(d.original&&!d.script&&['Scheduled','Change pending'].includes(d.status)&&addDays(eff(d),-S.settings.scriptLead)<=S.demoDate){
 d.script=newScript(d);log(d,`Script template requested from the proponent, due ${fmt(d.script.due)}`);
 mail(`${dept(d.dept).head} <${d.dept}>`,`Write the drill script for ${d.id}`,`The drill is on ${fmt(eff(d))}. Please submit the scenario and event list by ${fmt(d.script.due)}.`)}})}
const canEditScript=d=>d.script&&['Requested','Draft','Returned'].includes(d.script.status)&&(S.role==='admin'||(S.role==='proponent'&&d.dept===S.dept));
function facts(t){t=(t||'').toLowerCase();const G={girl:'F',woman:'F',female:'F',boy:'M',man:'M',male:'M'};
 return{ages:[...t.matchAll(/(\d+)[- ]year[- ]old/g)].map(m=>m[1]),gen:[...t.matchAll(/\b(girl|boy|woman|man|female|male)\b/g)].map(m=>G[m[1]]),locs:[...t.matchAll(/\b(ward|pod|wing|building)\s+([a-z0-9]+)\b/g)].map(m=>m[1]+' '+m[2])}}
function checkScript(d){const s=d.script,e=[],w=[];
 if(!s.story||s.story.length<30)e.push('Write the scenario story (a sentence or two at least)');
 if(!s.objectives.filter(x=>x.trim()).length)e.push('Add at least one objective');
 if(S.settings.hvaRequired&&!s.hva)e.push('Link the script to a ranked hazard (HVA) - required by setting');
 if(!s.events.length)e.push('Add the event list');
 s.events.forEach((x,i)=>{if(!x.event.trim())e.push(`Event ${i+1}: describe what happens`);if(!x.role)e.push(`Event ${i+1}: pick a role`);
  else if(!s.roles.some(r=>r.role===x.role))w.push(`Event ${i+1}: role "${x.role}" is not in the roles table`);if(!x.expected.trim())w.push(`Event ${i+1}: no expected action`)});
 for(let i=1;i<s.events.length;i++)if(+s.events[i].t<+s.events[i-1].t)w.push(`Event ${i+1} is earlier than event ${i}; minutes should go forward`);
 ['Drill controller','Evaluator / observer'].forEach(r=>{if(!s.roles.some(x=>x.role===r&&x.badge))e.push(`Assign a person as ${r}`)});
 s.roles.forEach(r=>{if(!r.badge&&!['Drill controller','Evaluator / observer'].includes(r.role))w.push(`No person assigned to ${r.role}`)});
 const F=facts(s.story),gn=g=>g==='F'?'female':'male';
 s.events.forEach((x,i)=>{const f=facts(x.event+' '+x.expected);
  f.ages.forEach(a=>{if(F.ages.length&&!F.ages.includes(a))w.push(`Story vs event ${i+1}: event says ${a}-year-old, story says ${F.ages.join(', ')}-year-old`)});
  [...new Set(f.gen)].forEach(g=>{if(F.gen.length&&!F.gen.includes(g))w.push(`Story vs event ${i+1}: event says ${gn(g)}, story says ${gn(F.gen[0])}`)});
  f.locs.forEach(l=>{if(F.locs.length&&!F.locs.includes(l))w.push(`Story vs event ${i+1}: event mentions ${l}, story is in ${F.locs.join(', ')}`)})});
 return{e,w:[...new Set(w)]}}

 generate(){if(S.role!=='admin')return fail('Only the EPPU admin can generate the plan');

 setDate(id,v){const d=drill(id);if(!canEditDate(d))return fail('You cannot change this date now');

 ${AREAS.map(a=>{const ds=S.drills.filter(d=>d.area===a.id);return`<tr><td><b>${a.id}</b> <span class="muted">${a.name}</span></td><td>${ds.length}</td><td>${ds.filter(d=>d.planned).length}</td><td>${ds.filter(d=>warns(d).length).length||''}</td><td>${chip(unit(S.settings.approvalMode==='area'?a.id:'ALL').status)}</td></tr>`}).join('')}
 </tbody></table></div></div>
 <div class="card"><h2>Drills per month</h2><div class="tbl"><table class="heat"><thead><tr><th>Area</th>${MON.map(m=>`<th>${m[0]}</th>`).join('')}</tr></thead><tbody>

function filtered(){const f=UI.f;return S.drills.filter(d=>(!f.area||d.area===f.area)&&(!f.code||d.code===f.code)&&
 (!f.month||(eff(d)||d.start).slice(5,7)===f.month)&&(!f.status||(f.status==='Warnings'?warns(d).length:f.status==='Due'?isDue(d):d.status===f.status))&&
 (!(S.role==='proponent'&&f.mine)||d.dept===S.dept)&&(!f.q||(d.id+' '+dept(d.dept).name).toLowerCase().includes(f.q.toLowerCase())))
 .sort((a,b)=>a.area.localeCompare(b.area)||((eff(a)||a.start)<(eff(b)||b.start)?-1:1))}
function pPlan(){if(S.planStatus==='Not started')return`<h1>Annual plan</h1><div class="card">The ${YEAR} plan has not been generated yet. ${S.role==='admin'?`<button class="btn primary" onclick="A.generate()">Generate ${YEAR} slots</button>`:'Switch to the EPPU admin role to generate it.'}</div>`;
 const f=UI.f,sel=(k,opts,lbl)=>`<select onchange="UI.f.${k}=this.value;renderTable()"><option value="">${lbl}</option>${opts.map(([v,t])=>`<option value="${v}" ${f[k]===v?'selected':''}>${t}</option>`).join('')}</select>`;
 return`<h1>${S.role==='proponent'&&f.mine?'My drills':'Annual plan'} ${YEAR}</h1>
 <p class="sub">Each row is one mandatory drill created from the frequency rules. ${S.role==='proponent'?'Pick a date inside the required period. The app warns about weekends, holidays, clashes and crowded weeks.':'Click a row to open the record.'}</p>
 <div class="filters noprint">${sel('area',AREAS.map(a=>[a.id,a.id+' · '+a.name]),'All areas')}${sel('code',CODES.map(c=>[c.id,c.name]),'All codes')}
 ${sel('month',MON.map((m,i)=>[pad(i+1),m]),'All months')}${sel('status',['Open','Date proposed','Submitted','Scheduled','Change pending','Redo required','Completed','Warnings','Due'].map(s=>[s,s==='Due'?'Due for outcome':s==='Warnings'?'With warnings':s]),'All statuses')}
 <input placeholder="Search ID or department" value="${esc(f.q)}" oninput="UI.f.q=this.value;renderTable()">
 ${S.role==='proponent'?`<label class="row" style="gap:6px"><input type="checkbox" ${f.mine?'checked':''} onchange="UI.f.mine=this.checked;render()"> Only my department</label>`:''}
 ${S.drills.some(canEditDate)?`<button class="btn" onclick="A.suggest('${S.role==='admin'?'all':'mine'}')">Suggest dates for open slots</button>`:''}</div>
 <div id="tbl"></div>`}
function renderTable(){const el=document.getElementById('tbl');if(!el)return;const rows=filtered();
 el.innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:6px">${rows.length} drills</div><div class="tbl"><table><thead><tr><th>Drill</th><th>Code</th><th>Area</th><th>Required period</th><th>Proponent</th><th>Date</th><th>Original approved</th><th>Status</th><th>Script</th><th></th></tr></thead><tbody>
 ${rows.map(d=>{const w=warns(d);return`<tr class="click" onclick="A.open('${d.id}')"><td class="mono">${d.id}</td><td>${cdot(d.code)}${code(d.code).name}</td><td>${d.area}</td>
 <td>${d.label}${d.shift?' · '+d.shift:''}</td><td>${esc(dept(d.dept).name)}</td>
 <td onclick="event.stopPropagation()">${canEditDate(d)?`<input type="date" min="${d.start}" max="${d.end}" value="${d.planned||''}" onchange="A.setDate('${d.id}',this.value)">`:fmtd(eff(d))}${w.length?` <span class="w" title="${esc(w.join('\n'))}">⚠ ${w.length}</span>`:''}</td>
 <td>${d.original?(d.original!==d.current?`<s class="muted">${fmt(d.original)}</s>`:fmt(d.original)):'—'}</td><td>${chip(d.status)}</td><td>${d.script?chip(d.script.status):''}</td>
 <td onclick="event.stopPropagation()">${canRun(d)?`<button class="btn sm primary" onclick="A.openRun('${d.id}')">Drill day</button>`:canChange(d)?`<button class="btn sm" onclick="A.modal('${d.status==='Redo required'?'redo':'change'}','${d.id}')">${d.status==='Redo required'?'Redo':'Change'}</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="10" class="muted">No drills match the filters.</td></tr>'}
 </tbody></table></div>`}

function pApprovals(){const pend=S.changes.filter(c=>c.status==='Pending');
 return`<h1>Approvals</h1><p class="sub">OEMC approves the plan ${S.settings.approvalMode==='area'?'area by area (setting)':'as one package (setting)'} and decides every change request. EPPU submits each part once all its drills have a date.</p>
 <div class="card"><h2>Plan approval</h2>${S.planStatus==='Not started'?'<p class="muted">The plan has not been generated yet.</p>':`<div class="tbl"><table><thead><tr><th>Part</th><th>Drills</th><th>Dated</th><th>With warnings</th><th>Status</th><th class="wrap">Comment</th><th></th></tr></thead><tbody>
 ${unitIds().map(u=>{const ds=S.drills.filter(d=>unitOf(d)===u),st=unit(u).status;return`<tr><td><b>${unitName(u)}</b></td><td>${ds.length}</td><td>${ds.filter(d=>d.planned).length}</td><td>${ds.filter(d=>warns(d).length).length}</td><td>${chip(st)}</td><td class="wrap">${esc(unit(u).comment||'')}</td>
 <td>${S.role==='admin'&&['Draft','Returned'].includes(st)?`<button class="btn sm primary" onclick="A.submit('${u}')" ${ds.every(d=>d.planned)?'':'disabled'}>Submit</button>`:''}
 ${S.role==='oemc'&&st==='Submitted'?`<button class="btn sm ok" onclick="A.approve('${u}')">Approve</button> <button class="btn sm danger" onclick="A.modal('return','${u}')">Return</button> <button class="btn sm" onclick="UI.f={area:'${u==='ALL'?'':u}',code:'',month:'',status:'',q:'',mine:false};A.go('plan')">View drills</button>`:''}</td></tr>`}).join('')}
 </tbody></table></div>`}</div>
 <div class="card"><h2>Change requests waiting (${pend.length})</h2>${pend.length?changeTable(pend,S.role==='oemc'):'<p class="muted">None.</p>'}</div>`}
function changeTable(list,act){return`<div class="tbl"><table><thead><tr><th>Request</th><th>Drill</th><th>Type</th><th>From</th><th>To</th><th class="wrap">Reason</th><th>Warnings</th><th>Requested</th><th>Status</th>${act?'<th></th>':''}</tr></thead><tbody>
 ${list.map(c=>`<tr><td class="mono">${c.id}</td><td class="mono"><a href="#" onclick="A.open('${c.drill}');return false">${c.drill}</a></td><td>${c.type==='redo'?'Redo':'Reschedule'}</td><td>${fmtd(c.from)}</td><td>${fmtd(c.to)}</td>
 <td class="wrap">${esc(c.reason)}${c.comment?`<div class="muted" style="font-size:13px">${esc(c.comment)}</div>`:''}${c.decision?`<div class="muted" style="font-size:13px">OEMC: ${esc(c.decision)}</div>`:''}</td>
 <td>${c.warnings.length?`<span class="w" title="${esc(c.warnings.join('\n'))}">⚠ ${c.warnings.length}</span>`:''}</td><td>${fmt(c.at)}<div class="muted" style="font-size:12.5px">${esc(c.by.split(' (')[0])}</div></td><td>${chip(c.status)}</td>
 ${act?`<td>${c.status==='Pending'?`<button class="btn sm ok" onclick="A.decide('${c.id}',true,'')">Approve</button> <button class="btn sm danger" onclick="A.modal('reject','${c.id}')">Reject</button>`:''}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function pChanges(){const k=kpi();const byR={};S.changes.forEach(c=>byR[c.reason]=(byR[c.reason]||0)+1);
 return`<h1>Change control</h1><p class="sub">After approval, a drill moves only through a change request approved by OEMC. The original approved date is never overwritten, so "held on approved date" can be measured. A drill that was not completed must be redone in the same month.</p>
 <div class="kpis"><div class="tile ${k.comp?(k.held/k.comp>=.9?'good':'bad'):''}"><div class="k">Held on approved date</div><div class="v">${pct(k.held,k.comp)}</div><div class="h">${k.held} of ${k.comp} completed drills</div></div>
 <div class="tile"><div class="k">Requests</div><div class="v">${S.changes.length}</div><div class="h">${k.pend} pending · ${k.appr} approved · ${S.changes.filter(c=>c.status==='Rejected').length} rejected</div></div>
 <div class="tile"><div class="k">Redos</div><div class="v">${S.changes.filter(c=>c.type==='redo').length}</div><div class="h">requested after not completed</div></div></div>
 ${Object.keys(byR).length?`<div class="card"><h2>Requests by reason</h2>${Object.entries(byR).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`<div class="row" style="gap:10px;margin:4px 0"><div style="width:240px">${esc(r)}</div><div style="height:12px;border-radius:3px;background:var(--blue);width:${n*24}px"></div><span class="mono">${n}</span></div>`).join('')}</div>`:''}
 <div class="card"><h2>All requests</h2>${S.changes.length?changeTable(S.changes,S.role==='oemc'):'<p class="muted">No change requests yet. Open an approved drill and choose "Request change".</p>'}</div>`}

function pScripts(){const sf=UI.sf||'all',all=S.drills.filter(d=>d.script&&(S.role!=='proponent'||!UI.f.mine||d.dept===S.dept)),k=kpi();
 const F={all:['All',()=>true],write:['To write',d=>['Requested','Draft','Returned'].includes(d.script.status)],review:['In review',d=>d.script.status==='Submitted'],
  ok:['Approved',d=>d.script.status==='Approved'],late:['Overdue',d=>d.script.status!=='Approved'&&d.script.due<S.demoDate]};
 const rows=all.filter(F[sf][1]).sort((a,b)=>eff(a)<eff(b)?-1:1);
 return`<h1>Drill scripts</h1><p class="sub">The app asks the proponent for a script ${S.settings.scriptLead} days before each approved drill (setting). The script is due ${S.settings.scriptDue} days before the drill and needs OEMC approval. Each script has a story, objectives, roles and a minute-by-minute event list.</p>
 <div class="kpis"><div class="tile ${k.sAppr?(k.sOnTime/k.sAppr>=.9?'good':'bad'):''}"><div class="k">Approved on time</div><div class="v">${pct(k.sOnTime,k.sAppr)}</div><div class="h">${k.sOnTime} of ${k.sAppr} approved by the due date</div></div>
 <div class="tile"><div class="k">Review rounds</div><div class="v">${k.sRounds}</div><div class="h">average per approved script</div></div>
 <div class="tile ${k.sLate?'bad':''}"><div class="k">Overdue</div><div class="v">${k.sLate}</div><div class="h">past due, not approved</div></div></div>
 <div class="tabs">${Object.entries(F).map(([key,[l,fn]])=>`<button class="${sf===key?'on':''}" onclick="UI.sf='${key}';render()">${l} (${all.filter(fn).length})</button>`).join('')}</div>
 ${S.role==='proponent'?`<label class="row" style="gap:6px;margin-bottom:10px"><input type="checkbox" ${UI.f.mine?'checked':''} onchange="UI.f.mine=this.checked;render()"> Only my department</label>`:''}
 <div class="tbl"><table><thead><tr><th>Drill</th><th>Code</th><th>Drill date</th><th>Proponent</th><th>Requested</th><th>Due</th><th>Status</th><th>Rounds</th><th>Check</th><th></th></tr></thead><tbody>
 ${rows.map(d=>{const s=d.script,late=s.status!=='Approved'&&s.due<S.demoDate;return`<tr class="click" onclick="A.openScript('${d.id}')"><td class="mono">${d.id}</td><td>${cdot(d.code)}${code(d.code).name}</td><td>${fmtd(eff(d))}</td><td>${esc(dept(d.dept).name)}</td>
 <td>${fmt(s.requestedAt)}</td><td class="${late?'e':''}">${fmt(s.due)}</td><td>${chip(s.status)}</td><td>${s.rounds.length||''}</td><td>${s.warnings&&s.warnings.length&&s.status==='Submitted'?`<span class="w">⚠ ${s.warnings.length}</span>`:''}</td>
 <td><button class="btn sm">${canEditScript(d)?'Edit':S.role==='oemc'&&s.status==='Submitted'?'Review':'View'}</button></td></tr>`}).join('')||'<tr><td colspan="10" class="muted">No scripts here. Scripts appear once a drill is approved and within '+S.settings.scriptLead+' days.</td></tr>'}
 </tbody></table></div>`}
function chkHtml(r){return r.e.map(x=>`<div class="e">✕ ${esc(x)}</div>`).join('')+r.w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join('')+(!r.e.length&&!r.w.length?'<div class="ok">✓ Script is complete and consistent</div>':'')}
function refreshCheck(id){const el=document.getElementById('chk');if(el)el.innerHTML=chkHtml(checkScript(drill(id)))}
function pScript(){const d=drill(UI.sid);if(!d||!d.script)return'<p>Script not found.</p>';const s=d.script,ed=canEditScript(d),r=checkScript(d),id=d.id;
 const inp=(v,on,extra='')=>`<input value="${esc(v)}" oninput="${on}" ${extra} style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%">`;
 const area_staff=STAFF.filter(x=>x.area===d.area||x.dept===d.dept);
 return`<div class="row noprint" style="margin-bottom:10px"><button class="btn sm" onclick="A.go('scripts')">← Scripts</button><button class="btn sm" onclick="A.open('${id}')">Drill record</button><button class="btn sm" onclick="print()">Print</button></div>
 <h1>${cdot(d.code)}Script · ${code(d.code).name} · ${area(d.area).name}</h1>
 <p class="sub"><span class="mono">${id}</span> · drill on <b>${fmtd(eff(d))}</b>${d.shift?' · '+d.shift+' shift':''} · proponent ${esc(dept(d.dept).name)} · requested ${fmt(s.requestedAt)} · due <b class="${s.status!=='Approved'&&s.due<S.demoDate?'e':''}">${fmt(s.due)}</b> · ${chip(s.status)}</p>
 ${s.rounds.length?`<div class="card"><h2>OEMC review rounds</h2>${s.rounds.map((x,i)=>`<div style="margin:4px 0">Round ${i+1} · ${fmt(x.at)} · ${chip(x.decision)} ${esc(x.comment)}</div>`).join('')}</div>`:''}
 <div class="card"><h2>Automatic check</h2><div id="chk" class="msgs">${chkHtml(r)}</div>
 <div class="row noprint" style="margin-top:10px">${ed?`<button class="btn" onclick="A.sTemplate('${id}')">Start from the ${code(d.code).name} template</button><button class="btn primary" onclick="A.sSubmit('${id}')">Submit to OEMC</button>`:''}
 ${S.role==='oemc'&&s.status==='Submitted'?`<button class="btn ok" onclick="A.sDecide('${id}',true,'')">Approve script</button><button class="btn danger" onclick="A.modal('sreturn','${id}')">Return with comments</button>`:''}</div>
 ${S.role==='oemc'&&s.status==='Submitted'&&s.warnings.length?`<p class="muted" style="font-size:13px">The proponent submitted with ${s.warnings.length} warning(s) from the check above.</p>`:''}</div>
 <div class="card"><h2>Scenario</h2>
 <div class="field"><label>Story</label>${ed?`<textarea oninput="A.sSet('${id}','story',this.value)" style="min-height:90px">${esc(s.story)}</textarea>`:`<div>${esc(s.story)||'<span class="muted">—</span>'}</div>`}</div>
 <div class="grid2"><div class="field"><label>Location</label>${ed?inp(s.location,`A.sSet('${id}','location',this.value)`):`<div>${esc(s.location)||'—'}</div>`}</div>
 <div class="field"><label>Linked hazard (HVA rank)${S.settings.hvaRequired?' *':' · optional'}</label>${ed?`<select onchange="A.sSet('${id}','hva',this.value)"><option value="">None</option>${HVA.map((h,i)=>`<option value="${h}" ${s.hva===h?'selected':''}>${i+1}. ${h}</option>`).join('')}</select>`:`<div>${s.hva?`${HVA.indexOf(s.hva)+1}. ${s.hva}`:'—'}</div>`}</div></div>
 <div class="field"><label>Objectives</label>${s.objectives.map((o,i)=>ed?`<div class="row" style="flex-wrap:nowrap">${inp(o,`A.sObj('${id}',${i},this.value)`,`placeholder="Objective ${i+1}"`)}<button class="btn sm danger" onclick="A.sDel('${id}','objectives',${i})">✕</button></div>`:`<div>${i+1}. ${esc(o)}</div>`).join('')}
 ${ed?`<div><button class="btn sm" onclick="A.sAdd('${id}','obj')">+ Objective</button></div>`:''}</div>
 <div class="field"><label>Scenario map</label>${s.map?`<img src="${s.map}" alt="Scenario map" style="max-width:100%;max-height:320px;border:1px solid var(--line);border-radius:6px">`:'<span class="muted">No map</span>'}
 ${ed?`<input type="file" accept="image/*" onchange="A.sMap('${id}',this)">${s.map?`<button class="btn sm danger" onclick="A.sSet('${id}','map',null);render()">Remove map</button>`:''}`:''}</div></div>
 <div class="card"><h2>Roles</h2><div class="tbl"><table><thead><tr><th>Role</th><th>Person</th><th>Department</th>${ed?'<th></th>':''}</tr></thead><tbody>
 ${s.roles.map((x,i)=>{const p=staff(x.badge);return`<tr><td>${ed?`<select onchange="A.sRole('${id}',${i},'role',this.value)">${ROLES.map(o=>`<option ${o===x.role?'selected':''}>${o}</option>`).join('')}</select>`:x.role}</td>
 <td>${ed?`<select onchange="A.sRole('${id}',${i},'badge',this.value)"><option value="">Not assigned</option>${area_staff.map(o=>`<option value="${o.badge}" ${o.badge===x.badge?'selected':''}>${o.name} · ${o.job} · ${o.badge}</option>`).join('')}</select>`:p?`${p.name} <span class="muted">${p.badge}</span>`:'<span class="muted">Not assigned</span>'}</td>
 <td>${p?esc(dept(p.dept).name):''}</td>${ed?`<td><button class="btn sm danger" onclick="A.sDel('${id}','roles',${i})">✕</button></td>`:''}</tr>`}).join('')}</tbody></table></div>
 ${ed?`<button class="btn sm" style="margin-top:8px" onclick="A.sAdd('${id}','role')">+ Role</button>`:''}</div>
 <div class="card"><h2>Event list (minute by minute)</h2><div class="tbl"><table><thead><tr><th>Minute</th><th class="wrap">What happens</th><th class="wrap">Expected action</th><th>Role</th>${ed?'<th></th>':''}</tr></thead><tbody>
 ${s.events.map((x,i)=>ed?`<tr><td><input type="number" min="0" value="${x.t}" oninput="A.sEv('${id}',${i},'t',this.value)" style="width:70px;border:1px solid var(--line);border-radius:6px;padding:5px"></td>
 <td class="wrap" style="min-width:220px">${inp(x.event,`A.sEv('${id}',${i},'event',this.value)`)}</td><td class="wrap" style="min-width:200px">${inp(x.expected,`A.sEv('${id}',${i},'expected',this.value)`)}</td>

 <li>As <b>Proponent</b>, open Drill scripts, pick a requested script, start from the template and edit it. Change an age or a ward in one event and watch the check flag it. Submit.</li>
 <li>As <b>OEMC</b>, open the Code Pink script in review: the check shows the story and the event list disagree on the child. Return it with comments, or approve another script.</li>
 <li>As <b>Observer</b>, open Drill day, jump to an upcoming drill, fill the checklist on a tablet, add participants by badge, log a finding as a possible gap and record the result.</li>
 <li>Open the drill <b>IT-DH-Y</b> (oxygen supply failure, April): its record has the "radio not transmitting" finding flagged for Step 3.</li></ol></div>
 <div class="card"><h2>Business rules in step 2</h2><ol class="list">
 <li>BR-11 When a drill is approved and ${S.settings.scriptLead} days away, the app requests the script from the proponent. It is due ${S.settings.scriptDue} days before the drill (settings).</li>
 <li>BR-12 A script needs a story, at least one objective, an event list with a role on each event, and a person as drill controller and as evaluator / observer. Hard stop.</li>
 <li>BR-13 The story is checked against each event: ages, male / female and ward or building names must match. Mismatches are warnings that OEMC sees.</li>
 <li>BR-14 OEMC approves or returns a script with comments; each decision is a review round. KPIs: approved on time and average rounds.</li>
 <li>BR-15 Drill day can be recorded only on or after the drill date and, by setting, only with an approved script.</li>
 <li>BR-16 Completed needs every checklist item answered, an end time and at least one participant. Not completed needs a reason and starts the redo rule (BR-09). Postponed opens a change request (BR-07).</li>
 <li>BR-17 Participants are recorded by badge from the Datasphere staff list. KPI: share of staff in at least one drill.</li>
 <li>BR-18 Findings carry one of 8 types; those marked "possible gap" go to the improvement plan in Step 3.</li></ol></div>
 <div class="card"><h2>How to walk through it</h2><ol class="list">
 <li>As <b>EPPU admin</b>, open Master lists and check the frequency rules, then generate the ${YEAR} slots from Overview.</li>
 <li>Switch to <b>Proponent</b>, pick a department and set dates in My drills. Try a Friday, Eid or a date outside the period to see the checks.</li>
 <li>Back as admin, let the app suggest the remaining dates and submit each area.</li>
 <li>As <b>OEMC</b>, approve the areas (or return one with a comment). Then, as admin, send the copy to MOH and MSMD.</li>
 <li>Move the demo date forward in the header, request a change as a proponent and approve it as OEMC. The original date stays.</li>
 <li>Or press <b>Load mid-year</b> on Overview to see KPIs with half a year of history.</li></ol></div>
 <div class="card"><h2>Business rules in this step</h2><ol class="list">
 <li>BR-01 One slot per code, area and period from the frequency table; quarterly-per-shift creates Day, Evening and Night slots.</li>
 <li>BR-02 A planned date must fall inside its required period. Hard stop.</li>
 <li>BR-03 Warnings (do not block): weekend, public holiday, Ramadan, same day as another drill in the area, more than ${S.settings.maxPerWeek} drills per area per week, less than ${S.settings.minGap} days from the same code in the area.</li>
 <li>BR-04 EPPU submits a part only when every drill in it has a date. OEMC approves or returns with a comment.</li>
 <li>BR-05 On approval the planned date becomes the original approved date and is never changed afterwards.</li>
 <li>BR-06 The copy for MOH and Aramco MSMD can be sent only when the whole plan is approved.</li>
 <li>BR-07 After approval a date changes only through a change request with a reason from the list, approved by OEMC.</li>
 <li>BR-08 Moving a drill earlier counts as off-schedule (setting). Moving it out of its period is warned.</li>
 <li>BR-09 A drill not completed must be redone in the same calendar month, after the failed date.</li>
 <li>BR-10 KPI held on approved date = completed on the original approved date ÷ completed. Target above 90%.</li></ol></div>
 <div class="card"><h2>Demo to SAP BTP</h2><div class="tbl"><table><thead><tr><th>Piece</th><th class="wrap">In the demo</th><th class="wrap">On SAP BTP</th></tr></thead><tbody>
 <tr><td>Screens</td><td class="wrap">This web app, Fiori-style worklist, record and inbox</td><td class="wrap">SAP Build Apps or SAP Fiori elements</td></tr>
 <tr><td>Approvals, emails</td><td class="wrap">Status flows, in-app inbox and email log</td><td class="wrap">SAP Build Process Automation</td></tr>
 <tr><td>Drill records</td><td class="wrap">This browser's storage; Reset restores sample data</td><td class="wrap">SAP HANA Cloud, replicated to Datasphere</td></tr>
 <tr><td>People, CPH, facilities</td><td class="wrap">Sample Datasphere tab, read-only</td><td class="wrap">Live from Datasphere (BDC)</td></tr>
 <tr><td>KPIs</td><td class="wrap">Overview tiles</td><td class="wrap">SAC on Datasphere (UC15, UC17)</td></tr></tbody></table></div></div>
 <p class="muted" style="font-size:13px">All names, departments and records are fictional. Changes are saved only in this browser.</p>`}

/* ---------- Drawer and modals ---------- */
function drawer(){const d=drill(UI.drawer);if(!d)return'';const w=warns(d),c=code(d.code);
 return`<div class="overlay" onclick="if(event.target===this)A.close()"><div class="drawer">
 <div class="row" style="justify-content:space-between"><span class="mono muted">${d.id}</span><button class="btn sm" onclick="A.close()">Close</button></div>
 <h1 style="margin-top:8px">${cdot(d.code)}${c.name} · ${area(d.area).name}</h1><div>${chip(d.status)}${d.redo?' '+chip('Redo'):''}</div>
 <dl class="kv"><dt>Meaning</dt><dd>${c.meaning}</dd><dt>Required period</dt><dd>${d.label}${d.shift?' · '+d.shift+' shift':''} (${fmt(d.start)} to ${fmt(d.end)})</dd>
 <dt>Proponent</dt><dd>${esc(dept(d.dept).name)}<div class="muted">CPH: ${esc(dept(d.dept).head)}</div></dd><dt>Rule</dt><dd>${FREQ[d.freq]} in ${d.area}</dd>
 <dt>Planned date</dt><dd>${fmtd(d.planned)}</dd><dt>Original approved</dt><dd>${fmtd(d.original)}</dd><dt>Current date</dt><dd>${fmtd(d.current)}</dd>
 <dt>Changes</dt><dd>${d.changes}</dd>${d.notDoneDate?`<dt>Not completed</dt><dd>${fmt(d.notDoneDate)}: ${esc(d.notDoneReason)}</dd>`:''}${d.doneDate?`<dt>Completed</dt><dd>${fmtd(d.doneDate)} ${d.doneDate===d.original?chip('On approved date'):chip('Off approved date')}</dd>`:''}</dl>
 ${w.length?`<div class="msgs">${w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join('')}</div>`:''}
 <div class="row" style="margin:14px 0">${canEditDate(d)?`<label class="row" style="gap:8px">Date <input type="date" min="${d.start}" max="${d.end}" value="${d.planned||''}" onchange="A.setDate('${d.id}',this.value)" style="border:1px solid var(--line);border-radius:6px;padding:5px 8px"></label>`:''}
 ${canChange(d)?`<button class="btn primary" onclick="A.modal('${d.status==='Redo required'?'redo':'change'}','${d.id}')">${d.status==='Redo required'?'Request redo':'Request change'}</button>`:''}
 ${d.script?`<button class="btn" onclick="A.openScript('${d.id}')">${canEditScript(d)?'Edit script':'View script'}</button>`:''}
 ${canRun(d)?`<button class="btn primary" onclick="A.openRun('${d.id}')">Drill day</button>`:''}
 ${d.run&&d.run.result?`<button class="btn" onclick="UI.rid='${d.id}';A.go('run')">Drill-day record</button>`:''}</div>
 ${canRecord(d)&&!scriptOk(d)?'<p class="e" style="font-size:13px">The drill date has come but the script is not approved, so drill day cannot be recorded (setting).</p>':''}
 ${d.script?`<dl class="kv"><dt>Script</dt><dd>${chip(d.script.status)} due ${fmt(d.script.due)}${d.script.rounds.length?` · ${d.script.rounds.length} review round(s)`:''}</dd>
 ${d.run&&d.run.result?`<dt>Drill day</dt><dd>${d.run.participants.length} participants · ${d.run.findings.length} finding(s)${d.run.findings.some(f=>f.gap)?` · <span class="w">${d.run.findings.filter(f=>f.gap).length} possible gap(s)</span>`:''}</dd>`:''}</dl>`:''}
 <h2 style="margin-top:20px">History</h2><div class="hist">${d.history.slice().reverse().map(h=>`<div><div class="at">${fmt(h.at)} · ${esc(h.who)}</div>${esc(h.text)}</div>`).join('')}</div></div></div>`}
function modal(){const m=UI.modal;if(!m)return'';let h='';
 if(m.type==='change'||m.type==='redo'){const d=drill(m.id),redo=m.type==='redo';const min=addDays(S.demoDate,1);
  h=`<h2>${redo?'Request a redo':'Request a date change'} · <span class="mono">${d.id}</span></h2>
  <p class="muted">${redo?`Not completed on ${fmt(d.notDoneDate)}. The redo must be in the same month.`:`Current date ${fmtd(d.current)}. Original approved date ${fmt(d.original)} is kept.`}</p>
  <div class="field"><label>New date</label><input id="m-to" type="date" min="${min}" max="${YEAR}-12-31" oninput="liveCheck('${d.id}','${m.type}')"></div><div id="m-chk" class="msgs"></div>
  <div class="field"><label>Reason</label><select id="m-r"><option value="">Choose…</option>${REASONS.map(r=>`<option ${redo&&r.startsWith('Drill not')?'selected':''}>${r}</option>`).join('')}</select></div>
  <div class="field"><label>Comment</label><textarea id="m-c" placeholder="Optional"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn primary" onclick="A.requestChange('${d.id}',val('m-to'),val('m-r'),val('m-c'),'${m.type}')">Send to OEMC</button></div>`}
 if(m.type==='outcome'){const d=drill(m.id);h=`<h2>Record outcome · <span class="mono">${d.id}</span></h2><p class="muted">Drill date ${fmtd(d.current)}.</p>
  <div class="field"><label>Result</label><select id="m-res" onchange="document.getElementById('m-rw').style.display=this.value==='Completed'?'none':'grid'"><option>Completed</option><option>Not completed</option></select></div>
  <div class="field" id="m-rw" style="display:none"><label>Why was it not completed?</label><textarea id="m-why"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn primary" onclick="A.record('${d.id}',val('m-res'),val('m-why'))">Save</button></div>`}
 if(m.type==='sreturn')h=`<h2>Return script ${m.id} with comments</h2><div class="field"><label>What must the proponent change? (required)</label><textarea id="m-c">${esc(drill(m.id).script.warnings.join('\n'))}</textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn danger" onclick="A.sDecide('${m.id}',false,val('m-c'))">Return</button></div>`;
 if(m.type==='return'||m.type==='reject')h=`<h2>${m.type==='return'?'Return '+unitName(m.id)+' to EPPU':'Reject '+m.id}</h2><div class="field"><label>Comment (required)</label><textarea id="m-c"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn danger" onclick="${m.type==='return'?`A.returnUnit('${m.id}',val('m-c'))`:`A.decide('${m.id}',false,val('m-c'))`}">${m.type==='return'?'Return':'Reject'}</button></div>`;
 return`<div class="modalwrap" onclick="if(event.target===this){UI.modal=null;render()}"><div class="modal">${h}</div></div>`}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function liveCheck(id,mode){const v=val('m-to'),el=document.getElementById('m-chk');if(!v){el.innerHTML='';return}const r=check(drill(id),v,mode);
 el.innerHTML=r.e.map(x=>`<div class="e">✕ ${esc(x)}</div>`).join('')+r.w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join('')+(!r.e.length&&!r.w.length?'<div class="ok">✓ No conflicts found</div>':'')}

/* ---------- Shell ---------- */
const PAGES=[['Work',[['overview','Overview'],['plan','Annual plan'],['approvals','Approvals'],['changes','Change control'],['moh','MOH / MSMD copy'],['scripts','Drill scripts'],['day','Drill day']]],
 ['Data',[['master','Master lists'],['data','Datasphere (sample)'],['emails','Email log']]],['Help',[['about','About this demo']]]];
function render(){const n=counts();const props=[...new Set(S.drills.length?S.drills.map(d=>d.dept):CODES.flatMap(c=>AREAS.map(a=>proponentFor(c.id,a.id))))];
 const page={overview:pOverview,plan:pPlan,approvals:pApprovals,changes:pChanges,moh:pMOH,scripts:pScripts,script:pScript,day:pDay,run:pRun,master:pMaster,data:pData,emails:pEmails,about:pAbout}[UI.page]();
 document.getElementById('app').innerHTML=`<header class="shell"><div class="brand"><span class="mark">DR</span>EPPU Drill Manager</div><span class="demo-tag">Demo · sample data</span><span class="sp"></span>
 <label>View as <select onchange="A.setRole(this.value)"><option value="admin" ${S.role==='admin'?'selected':''}>EPPU admin</option><option value="proponent" ${S.role==='proponent'?'selected':''}>Proponent</option><option value="oemc" ${S.role==='oemc'?'selected':''}>OEMC reviewer</option><option value="observer" ${S.role==='observer'?'selected':''}>Observer</option></select></label>
 ${S.role==='proponent'?`<label>Dept <select onchange="A.setDept(this.value)">${DEPTS.filter(d=>props.includes(d.id)).map(d=>`<option value="${d.id}" ${S.dept===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>`:''}
 <label>Demo date <input type="date" value="${S.demoDate}" onchange="A.setDate0(this.value)"></label>
 <button class="btn sm" onclick="A.reset(S.demoDate>'2026-01-01'?'mid':'fresh')" title="Restore the sample data in this browser">Reset</button></header>
 <div class="layout"><nav>${PAGES.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,l])=>`<button class="${UI.page===k?'on':''}" onclick="A.go('${k}')"><span>${l}</span>${(b=>b?`<span class="badge">${b}</span>`:'')({approvals:n.appr,scripts:n.scripts,day:n.day}[k])}</button>`).join('')).join('')}</nav>
 <main>${page}</main></div>${drawer()}${modal()}`;
 renderTable()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.drawer||UI.modal))A.close()});
render();
