<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPPU Drill Manager · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#00123B;--blue:#2A66DD;--cyan:#1DC8DF;--purple:#753BBD;--ice:#CED9E5;--bg:#F4F6F9;--surface:#fff;--ink:#0B1630;--muted:#5A6782;--line:#DCE3EC;
--ok:#1E7A4F;--okbg:#E4F3EB;--warn:#94600F;--warnbg:#FCF1DC;--err:#B42727;--errbg:#FBE8E8;--info:#1F4FB0;--infobg:#E6EEFC;--pur:#5B2D96;--purbg:#EFE7F9;--grey:#4A556B;--greybg:#EBEEF3;
--font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.shell{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 13px var(--mono)}
.demo-tag{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(29,200,223,.18);color:var(--cyan);padding:5px 8px;border-radius:4px;white-space:nowrap}
.shell .sp{flex:1}
.shell label{font-size:12px;color:#B9C6DA;display:flex;align-items:center;gap:6px}
.shell select,.shell input{background:#0E2552;border:1px solid #29427A;color:#fff;border-radius:6px;padding:5px 8px;font-size:13.5px}
.shell .btn{background:transparent;border-color:#3A5491;color:#fff}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg);color:var(--ink)}
nav button.on{background:var(--infobg);color:var(--info);font-weight:600}
nav .grp{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8C97AD;padding:14px 12px 6px}
.badge{background:var(--err);color:#fff;border-radius:10px;font:600 11px/1 var(--mono);padding:3px 7px}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:24px;line-height:1.25;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 20px;max-width:80ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1F55C2}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:#E9B9B9}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k{font:500 11.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:28px;font-weight:700;line-height:1.2;margin-top:6px}
.tile .h{font-size:13px;color:var(--muted)}
.tile.good .v{color:var(--ok)} .tile.bad .v{color:var(--err)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap,th.wrap{white-space:normal}
th{font:600 11.5px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#F8FAFC;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:#F6F9FE}
.chip{display:inline-block;font:500 12px/1.7 var(--mono);padding:0 8px;border-radius:4px;white-space:nowrap}
.c-grey{background:var(--greybg);color:var(--grey)}.c-info{background:var(--infobg);color:var(--info)}.c-pur{background:var(--purbg);color:var(--pur)}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-err{background:var(--errbg);color:var(--err)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.w{color:var(--warn);font-weight:600}.e{color:var(--err);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input,.field input,.field select,.field textarea,td input[type=date],td select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;font-size:14px}
td input[type=date]{padding:3px 6px}
.note{border-left:3px solid var(--cyan);background:#F0FBFD;padding:10px 14px;border-radius:0 6px 6px 0;color:#1E4E5C;margin-bottom:16px;max-width:90ch}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed #9DB3D6;border-radius:8px;padding:12px 16px;margin-bottom:18px}
.todo{display:grid;gap:8px}
.todo .it{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.list{margin:0;padding-left:18px}.list li{margin:3px 0}
.heat td{text-align:center;padding:6px 4px;font:500 12.5px var(--mono)}
.heat td:first-child{text-align:left;padding-left:12px}
.overlay{position:fixed;inset:0;background:rgba(0,18,59,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:22px 24px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.modalwrap{position:fixed;inset:0;background:rgba(0,18,59,.4);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px 24px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.field{display:grid;gap:4px;margin:12px 0}
.field label{font-size:13px;font-weight:600}
.field textarea{min-height:70px}
.hist{border-left:2px solid var(--line);margin:8px 0 0 4px;padding-left:14px;display:grid;gap:8px;font-size:13.5px}
.hist .at{font:12px var(--mono);color:var(--muted)}
.msgs{display:grid;gap:4px;margin:8px 0}
.msgs div{font-size:13.5px;padding:6px 10px;border-radius:5px}
.msgs .e{background:var(--errbg)}.msgs .w{background:var(--warnbg)}.msgs .ok{background:var(--okbg);color:var(--ok)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.email{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px;background:#fff}
.email .meta{font:12px var(--mono);color:var(--muted)}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav .grp{display:none}nav button{white-space:nowrap}main{padding:18px 16px 60px}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
@media print{.shell,nav,.noprint{display:none!important}.layout{display:block}main{padding:0}.card,.tbl{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================================================================
   EPPU Drill Manager - demo, Step 1 (UC2 annual schedule, UC3 change
   control, UC19 master lists). All data is fictional sample data.
   State lives in this browser (localStorage); "Reset" restores it.
   =================================================================== */
const KEY='eppu-drill-demo-v1', YEAR=2026;

/* ---------- Sample "Datasphere" master data (read-only) ---------- */
const AREAS=[
 {id:'DH',name:'Dhahran',facility:'Main hospital',type:'Inpatient + ER'},
 {id:'AH',name:'Al-Hasa',facility:'Al-Hasa health center',type:'Inpatient + ER'},
 {id:'RT',name:'Ras Tanura',facility:'Ras Tanura health center',type:'Outpatient + ER'},
 {id:'UD',name:'Udhailiyah',facility:'Udhailiyah clinic',type:'Outpatient'},
 {id:'AB',name:'Abqaiq',facility:'Abqaiq clinic',type:'Outpatient'},
 {id:'RAC',name:'RAC',facility:'Ambulatory care clinics',type:'Outpatient'}];
const CODES=[
 {id:'RED',name:'Code Red',meaning:'Fire',color:'#D7263D',reviewer:'Safety & Fire Protection'},
 {id:'BLUE',name:'Code Blue',meaning:'Cardiac arrest / medical emergency',color:'#2A66DD',reviewer:'Resuscitation committee'},
 {id:'PINK',name:'Code Pink',meaning:'Infant or child abduction',color:'#EE6FA8',reviewer:'Security Services'},
 {id:'BROWN',name:'Code Brown',meaning:'Hazardous material spill',color:'#8B5A2B',reviewer:'Environmental Services'},
 {id:'ORANGE',name:'Code Orange',meaning:'Mass casualty / external disaster',color:'#F28C28',reviewer:'Emergency Department'},
 {id:'YELLOW',name:'Code Yellow',meaning:'Bomb threat',color:'#E8C547',reviewer:'Security Services'},
 {id:'GREY',name:'Code Grey',meaning:'Aggressive or violent person',color:'#9AA3B2',reviewer:'Security Services'},
 {id:'SILVER',name:'Code Silver',meaning:'Person with a weapon',color:'#C9D1DA',reviewer:'Security Services'},
 {id:'GREEN',name:'Code Green',meaning:'Evacuation',color:'#2E9E5B',reviewer:'Facilities Engineering'},
 {id:'IT',name:'IT downtime',meaning:'Loss of IT systems / downtime procedures',color:'#753BBD',reviewer:'IT Services'}];
const FREQ={M:'Monthly',Q:'Quarterly',Q3:'Quarterly, each shift',H:'Twice a year',Y:'Yearly','-':'Not required'};
/* Rows = code, columns = area (DH, AH, RT, UD, AB, RAC). Blue/Brown monthly, Pink quarterly, IT yearly come
   from the 21 Oct session; the rest are sample values to confirm with EPPU. */
const DEFAULT_FREQ={
 RED:{DH:'Q3',AH:'Q',RT:'Q',UD:'Q',AB:'Q',RAC:'Q'},
 BLUE:{DH:'M',AH:'M',RT:'M',UD:'M',AB:'M',RAC:'M'},
 PINK:{DH:'Q',AH:'Q',RT:'-',UD:'-',AB:'-',RAC:'-'},
 BROWN:{DH:'M',AH:'M',RT:'M',UD:'M',AB:'M',RAC:'M'},
 ORANGE:{DH:'H',AH:'H',RT:'H',UD:'H',AB:'H',RAC:'H'},
 YELLOW:{DH:'Y',AH:'Y',RT:'Y',UD:'Y',AB:'Y',RAC:'Y'},
 GREY:{DH:'H',AH:'H',RT:'H',UD:'-',AB:'-',RAC:'-'},
 SILVER:{DH:'Y',AH:'Y',RT:'-',UD:'-',AB:'-',RAC:'-'},
 GREEN:{DH:'Y',AH:'Y',RT:'Y',UD:'Y',AB:'Y',RAC:'Y'},
 IT:{DH:'Y',AH:'Y',RT:'Y',UD:'Y',AB:'Y',RAC:'Y'}};
const DEPTS=[
 ['ED','Emergency Department','DH','Dr. Khalid Al-Harbi'],['ICU','Critical Care','DH','Dr. Maryam Al-Dossary'],
 ['MAT',"Maternity & Women's Health",'DH','Dr. Noura Al-Shehri'],['PED','Pediatrics','DH','Dr. Saeed Al-Zahrani'],
 ['MSN','Medical-Surgical Nursing','DH','Reem Al-Otaibi'],['OR','Perioperative Services','DH','Dr. Tariq Al-Anazi'],
 ['LAB','Laboratory','DH','Dr. Hessa Al-Mansour'],['RAD','Radiology','DH','Dr. Omar Al-Qahtani'],
 ['PHA','Pharmacy','DH','Abdullah Al-Rashed'],['RES','Respiratory Therapy','DH','Lina Haddad'],
 ['SEC','Security Services','DH','Majed Al-Subaie'],['FAC','Facilities Engineering','DH','Eng. Fahad Al-Shammari'],
 ['BME','Biomedical Engineering','DH','Eng. Sara Al-Mutlaq'],['ITS','IT Services','DH','Yousef Al-Khaldi'],
 ['SFP','Safety & Fire Protection','DH','Hamad Al-Dawsari'],['EVS','Environmental Services','DH','Grace Mendoza'],
 ['AHN','Al-Hasa Nursing','AH','Amal Al-Naim'],['AHE','Al-Hasa Emergency','AH','Dr. Waleed Al-Mulhim'],
 ['AHF','Al-Hasa Facilities','AH','Eng. Ibrahim Al-Afaleq'],['RTH','Ras Tanura Health Center','RT','Dr. Huda Al-Ali'],
 ['RTF','Ras Tanura Facilities','RT','Eng. Nasser Al-Hajri'],['UDC','Udhailiyah Clinic','UD','Dr. Samir Khoury'],
 ['ABC','Abqaiq Clinic','AB','Dr. Latifa Al-Yami'],['RAC','Ambulatory Care Network','RAC','Dr. Ahmed Bukhari'],
 ['RAS','Ambulatory Support Services','RAC','Rana Al-Saleh']].map(([id,name,area,head])=>({id,name,area,head}));
const LOCAL={AH:'AHN',RT:'RTH',UD:'UDC',AB:'ABC',RAC:'RAC'};
const CODE_PROP={RED:{DH:'SFP',AH:'AHF',RT:'RTF',RAC:'RAS'},BLUE:{DH:'RES',AH:'AHE'},PINK:{DH:'MAT',AH:'AHN'},
 BROWN:{DH:'EVS',AH:'AHF',RT:'RTF'},ORANGE:{DH:'ED',AH:'AHE'},YELLOW:{DH:'SEC',AH:'AHE'},GREY:{DH:'SEC',AH:'AHN'},
 SILVER:{DH:'SEC',AH:'AHE'},GREEN:{DH:'FAC',AH:'AHF'},IT:{DH:'ITS',AH:'ITS',RT:'ITS',UD:'ITS',AB:'ITS',RAC:'ITS'}};
const proponentFor=(c,a)=>(CODE_PROP[c]&&CODE_PROP[c][a])||LOCAL[a]||'SFP';
const REASONS=['Clinical surge / high census','Staff shortage','Clash with another event or audit','Facility or equipment not available','Request from department head','Weather','Drill not completed - redo','Other'];
/* Approximate 2026 Saudi public holidays (sample) */
const HOLIDAYS=[['2026-02-22','2026-02-22','Founding Day'],['2026-03-19','2026-03-24','Eid al-Fitr (approx.)'],['2026-05-25','2026-05-30','Eid al-Adha (approx.)'],['2026-09-23','2026-09-23','National Day']];
const RAMADAN=['2026-02-18','2026-03-19'];
const holiday=s=>{const h=HOLIDAYS.find(([a,b])=>s>=a&&s<=b);return h?h[2]:null};
const inRamadan=s=>s>=RAMADAN[0]&&s<=RAMADAN[1];

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const STAFF=(()=>{const r=mulberry(42);const F=['Ahmed','Fatimah','Mohammed','Aisha','Abdulaziz','Nora','Faisal','Hind','Sultan','Mona','Turki','Reem','Bandar','Lama','Nawaf','Dana','Rakan','Joud','Ziyad','Shahad','Maria','John','Priya','Joseph','Anna','Rahul','Leila','Kareem','Salma','Hassan'];
 const L=['Al-Qahtani','Al-Ghamdi','Al-Otaibi','Al-Harbi','Al-Zahrani','Al-Dossary','Al-Shehri','Al-Mutairi','Al-Anazi','Al-Subaie','Al-Shammari','Al-Malki','Al-Juhani','Al-Rasheed','Al-Amri','Santos','Thomas','Nair','Fernandes','Haddad','Khan','Saleh','Mansour','Yousef','Ibrahim'];
 const J=['Staff Nurse','Charge Nurse','Physician','Resident','Respiratory Therapist','Pharmacist','Lab Technologist','Radiographer','Security Officer','Facilities Technician','Clerk','Patient Care Assistant','Paramedic','IT Analyst','Safety Officer'];
 const pick=a=>a[Math.floor(r()*a.length)];const out=[];
 for(let i=0;i<300;i++){const d=DEPTS[Math.floor(r()*DEPTS.length)];const t=r();
  out.push({badge:'B'+(704100+i*37),name:pick(F)+' '+pick(L),job:pick(J),dept:d.id,area:d.area,training:t<.82?'Current':t<.94?'Due in 30 days':'Expired'})}
 return out})();

/* ---------- Date helpers (ISO yyyy-mm-dd, UTC) ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=t=>t.toISOString().slice(0,10);
const addDays=(s,n)=>{const t=D(s);t.setUTCDate(t.getUTCDate()+n);return iso(t)};
const dow=s=>D(s).getUTCDay();
const diffDays=(a,b)=>Math.round((D(b)-D(a))/864e5);
const weekStart=s=>addDays(s,-dow(s)); /* KSA working week starts Sunday */
const fmt=s=>s?`${+s.slice(8)} ${MON[+s.slice(5,7)-1]} ${s.slice(0,4)}`:'—';
const fmtd=s=>s?`${DOWN[dow(s)]} ${fmt(s)}`:'—';
const pad=n=>String(n).padStart(2,'0');
const monthEnd=m=>iso(new Date(Date.UTC(YEAR,m,0)));
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function periods(f){const o=[];
 if(f==='M')for(let m=1;m<=12;m++)o.push({key:`${YEAR}-${pad(m)}`,label:`${MON[m-1]} ${YEAR}`,start:`${YEAR}-${pad(m)}-01`,end:monthEnd(m)});
 if(f==='Q'||f==='Q3')for(let q=1;q<=4;q++){const p={key:`${YEAR}Q${q}`,label:`Q${q} ${YEAR}`,start:`${YEAR}-${pad(q*3-2)}-01`,end:monthEnd(q*3)};
  if(f==='Q')o.push(p);else['Day','Evening','Night'].forEach(sh=>o.push({...p,shift:sh}))}
 if(f==='H'){o.push({key:`${YEAR}H1`,label:`H1 ${YEAR}`,start:`${YEAR}-01-01`,end:`${YEAR}-06-30`});o.push({key:`${YEAR}H2`,label:`H2 ${YEAR}`,start:`${YEAR}-07-01`,end:`${YEAR}-12-31`})}
 if(f==='Y')o.push({key:`${YEAR}`,label:`Year ${YEAR}`,start:`${YEAR}-01-01`,end:`${YEAR}-12-31`});
 return o}

/* ---------- State ---------- */
function fresh(){return{v:1,demoDate:'2025-12-01',planStatus:'Not started',freq:JSON.parse(JSON.stringify(DEFAULT_FREQ)),
 settings:{approvalMode:'area',earlierOff:true,maxPerWeek:3,minGap:14,pickDeadline:'2025-12-18'},
 drills:[],units:{},changes:[],emails:[],seq:0,role:'admin',dept:'SFP',sentAt:null}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const s=JSON.parse(t);if(s&&s.v===1)return s}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const UI={page:'overview',f:{area:'',code:'',month:'',status:'',q:'',mine:true},drawer:null,modal:null,ds:'depts',dsq:'',ml:'freq'};
let SILENT=false;

const ADMIN='Huda Al-Ghamdi (EPPU coordinator)',OEMC='Dr. Faisal Al-Mutairi (OEMC chair)';
const dept=id=>DEPTS.find(d=>d.id===id)||{id,name:id,head:'',area:''};
const code=id=>CODES.find(c=>c.id===id);
const area=id=>AREAS.find(a=>a.id===id);
const drill=id=>S.drills.find(d=>d.id===id);
const me=()=>S.role==='admin'?ADMIN:S.role==='oemc'?OEMC:`${dept(S.dept).head} (${dept(S.dept).name})`;
const eff=d=>d.current||d.planned;
const unitOf=d=>S.settings.approvalMode==='area'?d.area:'ALL';
const unitIds=()=>S.settings.approvalMode==='area'?AREAS.map(a=>a.id):['ALL'];
const unitName=u=>u==='ALL'?'Whole plan':`${u} · ${area(u).name}`;
const unit=u=>S.units[u]||(S.units[u]={status:'Draft'});
function log(d,text){d.history.push({at:S.demoDate,who:me(),text})}
function mail(to,subject,body){S.emails.unshift({at:S.demoDate,to,subject,body})}
function toast(m){if(SILENT)return;const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function done(m){if(SILENT)return;save();if(m)toast(m);render()}
function fail(m){if(!SILENT)toast(m);return false}

/* ---------- Business rules: date check ---------- */
function check(d,date,mode='plan'){const e=[],w=[];
 if(!date)return{e:['Pick a date'],w};
 if(date.slice(0,4)!==String(YEAR))e.push(`Date must be in ${YEAR}`);
 const inWin=date>=d.start&&date<=d.end;
 if(mode==='plan'&&!inWin)e.push(`Outside the required period (${fmt(d.start)} to ${fmt(d.end)})`);
 if(mode==='change'&&!inWin)w.push(`Moves out of its required period (${d.label}); that period's mandatory drill would be missed`);
 if(mode==='redo'){const m=d.notDoneDate.slice(0,7);if(date.slice(0,7)!==m)e.push(`A redo must be in the same month (${MON[+m.slice(5)-1]})`);if(date<=d.notDoneDate)e.push('A redo must be after the drill that was not completed')}
 if(mode!=='plan'&&date<=S.demoDate)e.push(`Must be after today (demo date ${fmt(S.demoDate)})`);

const canChange=d=>(S.role==='admin'||(S.role==='proponent'&&d.dept===S.dept))&&(d.status==='Scheduled'&&d.current>S.demoDate||d.status==='Redo required');

/* ---------- Actions ---------- */
const A={
 generate(){if(S.role!=='admin')return fail('Only the EPPU admin can generate the plan');
  S.drills=[];CODES.forEach(c=>AREAS.forEach(a=>{const f=S.freq[c.id][a.id];if(f==='-')return;

    S.drills.push({id,code:c.id,area:a.id,dept:proponentFor(c.id,a.id),freq:f,period:p.key,label:p.label,start:p.start,end:p.end,shift:p.shift||null,
     planned:null,original:null,current:null,status:'Open',changes:0,history:[{at:S.demoDate,who:'System',text:`Slot created from rule: ${c.name}, ${FREQ[f].toLowerCase()} in ${a.id}`}]})})}));
  S.units={};unitIds().forEach(u=>unit(u));S.planStatus='Collecting dates';
  const by={};S.drills.forEach(d=>by[d.dept]=(by[d.dept]||0)+1);
  Object.entries(by).forEach(([k,n])=>mail(`${dept(k).head} <${k}>`,`Pick dates for your ${n} drills in the ${YEAR} plan`,`EPPU has opened the ${YEAR} drill plan. Please choose a date for each of your ${n} drills by ${fmt(S.settings.pickDeadline)}.`));
  done(`${S.drills.length} drill slots created from the frequency rules`)},
 setDate(id,v){const d=drill(id);if(!canEditDate(d))return fail('You cannot change this date now');
  if(!v){d.planned=null;d.status='Open';log(d,'Date cleared');return done()}
  const r=check(d,v,'plan');if(r.e.length){done();return fail(r.e[0])}
  d.planned=v;d.status='Date proposed';log(d,`Date proposed: ${fmtd(v)}`+(r.w.length?` (warnings: ${r.w.join('; ')})`:''));
  done(r.w.length?`Saved with ${r.w.length} warning(s): ${r.w[0]}`:'Date saved')},
 suggest(scope){const list=S.drills.filter(d=>!d.planned&&canEditDate(d)&&(scope==='all'||d.dept===S.dept)).sort((a,b)=>diffDays(a.start,a.end)-diffDays(b.start,b.end));
  let n=0;for(const d of list){const len=diffDays(d.start,d.end)+1,off=hash(d.id)%len;let pick=null,fb=null;
   for(let i=0;i<len;i++){const c=addDays(d.start,(off+i)%len),r=check(d,c,'plan');if(r.e.length)continue;
    if(!fb&&dow(c)<5&&!holiday(c))fb=c;if(!r.w.length){pick=c;break}}
   const v=pick||fb;if(v){d.planned=v;d.status='Date proposed';log(d,`Date suggested by the app: ${fmtd(v)}`);n++}}
  done(n?`Suggested dates for ${n} drills. You can still change any of them.`:'No open slots to fill')},
 submit(u){if(S.role!=='admin')return fail('Only the EPPU admin submits the plan');
  const ds=S.drills.filter(d=>unitOf(d)===u);const open=ds.filter(d=>!d.planned).length;
  if(open)return fail(`${open} drill(s) in ${unitName(u)} still have no date`);
  const nw=ds.filter(d=>warns(d).length).length;
  unit(u).status='Submitted';unit(u).at=S.demoDate;ds.forEach(d=>{d.status='Submitted';log(d,'Submitted to OEMC')});
  if(S.planStatus==='Collecting dates')S.planStatus='In approval';
  mail(`OEMC <oemc>`,`Approve ${YEAR} drill plan: ${unitName(u)}`,`${ds.length} drills submitted by EPPU. ${nw} carry warnings. Please approve or return with comments.`);
  done(`${unitName(u)} submitted to OEMC`)},
 approve(u){if(S.role!=='oemc')return fail('Only OEMC approves the plan');
  const ds=S.drills.filter(d=>unitOf(d)===u);unit(u).status='Approved';unit(u).by=OEMC;unit(u).at=S.demoDate;unit(u).comment='';
  ds.forEach(d=>{d.original=d.planned;d.current=d.planned;d.status='Scheduled';log(d,`Approved by OEMC for ${fmtd(d.planned)}. This is now the original approved date.`)});
  const depts=[...new Set(ds.map(d=>d.dept))];depts.forEach(k=>mail(`${dept(k).head} <${k}>`,`Your ${YEAR} drill dates are approved (${unitName(u)})`,`OEMC approved ${ds.filter(d=>d.dept===k).length} drill dates. Any change now needs a change request.`));
  if(unitIds().every(x=>unit(x).status==='Approved')){S.planStatus='Approved';mail(`EPPU <eppu>`,`${YEAR} drill plan fully approved`,'All parts of the plan are approved. You can now send the copy to MOH and Aramco MSMD.')}
  done(`${unitName(u)} approved`)},
 returnUnit(u,comment){if(S.role!=='oemc')return fail('Only OEMC can return the plan');if(!comment)return fail('Add a comment for EPPU');

  ds.forEach(d=>{d.status='Date proposed';log(d,`Returned by OEMC: ${comment}`)});

 requestChange(id,to,reason,comment,type){const d=drill(id);if(!canChange(d))return fail('You cannot request a change on this drill');

  const c={id:'CR-'+pad(++S.seq).padStart(3,'0'),drill:id,type,from:type==='redo'?d.notDoneDate:d.current,to,reason,comment,warnings:r.w,status:'Pending',by:me(),at:S.demoDate};
  S.changes.unshift(c);d.prevStatus=d.status;d.status='Change pending';log(d,`${type==='redo'?'Redo':'Change'} requested (${c.id}): ${fmtd(c.from)} to ${fmtd(to)}. Reason: ${reason}${comment?'. '+comment:''}`);

/* ---------- Mid-year example: same actions, replayed ---------- */
function buildMid(){SILENT=true;S=fresh();const R=mulberry(7);
 S.role='admin';A.generate();A.suggest('all');unitIds().forEach(u=>A.submit(u));
 S.demoDate='2025-12-22';S.role='oemc';unitIds().forEach(u=>A.approve(u));S.role='admin';S.demoDate='2025-12-28';A.sendMOH();
 const today='2026-07-15';const okDay=c=>dow(c)<5&&!holiday(c);
 const past=S.drills.filter(d=>d.current<today).sort((a,b)=>a.current<b.current?-1:1);
 for(const d of past){const r=R();
  if(r<.07){let to=null;for(let k=2;k<14;k++){const c=addDays(d.current,k);if(c<=d.end&&c<today&&okDay(c)){to=c;break}}
   if(to){S.demoDate=addDays(d.current,-6);S.role='proponent';S.dept=d.dept;
    if(A.requestChange(d.id,to,REASONS[r<.035?0:2],'Department asked to move it','change')){S.role='oemc';A.decide(S.changes[0].id,true,'')}}}
  S.role='admin';S.demoDate=d.current;
  if(r>.955){A.record(d.id,'Not completed','Too few staff released from the unit');
   if(r>.975){let to=null;for(let k=3;k<20;k++){const c=addDays(d.notDoneDate,k);if(c.slice(0,7)===d.notDoneDate.slice(0,7)&&c<today&&okDay(c)){to=c;break}}
    if(to){S.role='proponent';S.dept=d.dept;if(A.requestChange(d.id,to,'Drill not completed - redo','Redo agreed with the unit','redo')){S.role='oemc';A.decide(S.changes[0].id,true,'');S.role='admin';S.demoDate=to;A.record(d.id,'Completed')}}}}
  else A.record(d.id,'Completed')}
 S.demoDate=today;
 const fut=S.drills.filter(d=>d.status==='Scheduled'&&d.current>addDays(today,5)).sort((a,b)=>a.current<b.current?-1:1);
 [0,7,15,24].forEach((i,j)=>{const d=fut[i];if(!d)return;let to=null;for(let k=3;k<20;k++){const c=addDays(d.current,k);if(c<=d.end&&okDay(c)){to=c;break}}
  if(to){S.role='proponent';S.dept=d.dept;A.requestChange(d.id,to,REASONS[[1,3,4,0][j]],['Two nurses on leave that week','Fire panel upgrade in that wing','CPH asked for the week after','High census expected'][j],'change')}});
 S.role='admin';S.dept='SFP';SILENT=false;return S}

function pAbout(){return`<h1>About this demo</h1><p class="sub">Step 1 of 3 of the drill lifecycle app: the annual schedule (UC2), change control (UC3) and master lists (UC19). Steps 2 and 3 add the script and drill day (UC4, UC5) and the report and gaps (UC6, UC7).</p>
 <div class="card"><h2>How to walk through it</h2><ol class="list">
 <li>As <b>EPPU admin</b>, open Master lists and check the frequency rules, then generate the ${YEAR} slots from Overview.</li>
 <li>Switch to <b>Proponent</b>, pick a department and set dates in My drills. Try a Friday, Eid or a date outside the period to see the checks.</li>
 <li>Back as admin, let the app suggest the remaining dates and submit each area.</li>
 <li>As <b>OEMC</b>, approve the areas (or return one with a comment). Then, as admin, send the copy to MOH and MSMD.</li>
 <li>Move the demo date forward in the header, request a change as a proponent and approve it as OEMC. The original date stays.</li>
 <li>Or press <b>Load mid-year</b> on Overview to see KPIs with half a year of history.</li></ol></div>
 <div class="card"><h2>Business rules in this step</h2><ol class="list">
 <li>BR-01 One slot per code, area and period from the frequency table; quarterly-per-shift creates Day, Evening and Night slots.</li>
 <li>BR-02 A planned date must fall inside its required period. Hard stop.</li>
 <li>BR-03 Warnings (do not block): weekend, public holiday, Ramadan, same day as another drill in the area, more than ${S.settings.maxPerWeek} drills per area per week, less than ${S.settings.minGap} days from the same code in the area.</li>
 <li>BR-04 EPPU submits a part only when every drill in it has a date. OEMC approves or returns with a comment.</li>
 <li>BR-05 On approval the planned date becomes the original approved date and is never changed afterwards.</li>
 <li>BR-06 The copy for MOH and Aramco MSMD can be sent only when the whole plan is approved.</li>
 <li>BR-07 After approval a date changes only through a change request with a reason from the list, approved by OEMC.</li>
 <li>BR-08 Moving a drill earlier counts as off-schedule (setting). Moving it out of its period is warned.</li>
 <li>BR-09 A drill not completed must be redone in the same calendar month, after the failed date.</li>
 <li>BR-10 KPI held on approved date = completed on the original approved date ÷ completed. Target above 90%.</li></ol></div>
 <div class="card"><h2>Demo to SAP BTP</h2><div class="tbl"><table><thead><tr><th>Piece</th><th class="wrap">In the demo</th><th class="wrap">On SAP BTP</th></tr></thead><tbody>
 <tr><td>Screens</td><td class="wrap">This web app, Fiori-style worklist, record and inbox</td><td class="wrap">SAP Build Apps or SAP Fiori elements</td></tr>
 <tr><td>Approvals, emails</td><td class="wrap">Status flows, in-app inbox and email log</td><td class="wrap">SAP Build Process Automation</td></tr>
 <tr><td>Drill records</td><td class="wrap">This browser's storage; Reset restores sample data</td><td class="wrap">SAP HANA Cloud, replicated to Datasphere</td></tr>
 <tr><td>People, CPH, facilities</td><td class="wrap">Sample Datasphere tab, read-only</td><td class="wrap">Live from Datasphere (BDC)</td></tr>
 <tr><td>KPIs</td><td class="wrap">Overview tiles</td><td class="wrap">SAC on Datasphere (UC15, UC17)</td></tr></tbody></table></div></div>
 <p class="muted" style="font-size:13px">All names, departments and records are fictional. Changes are saved only in this browser.</p>`}

 <dt>Changes</dt><dd>${d.changes}</dd>${d.notDoneDate?`<dt>Not completed</dt><dd>${fmt(d.notDoneDate)}: ${esc(d.notDoneReason)}</dd>`:''}${d.doneDate?`<dt>Completed</dt><dd>${fmtd(d.doneDate)} ${d.doneDate===d.original?chip('On approved date'):chip('Off approved date')}</dd>`:''}</dl>
 ${w.length?`<div class="msgs">${w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join('')}</div>`:''}
 <div class="row" style="margin:14px 0">${canEditDate(d)?`<label class="row" style="gap:8px">Date <input type="date" min="${d.start}" max="${d.end}" value="${d.planned||''}" onchange="A.setDate('${d.id}',this.value)" style="border:1px solid var(--line);border-radius:6px;padding:5px 8px"></label>`:''}
 ${canChange(d)?`<button class="btn primary" onclick="A.modal('${d.status==='Redo required'?'redo':'change'}','${d.id}')">${d.status==='Redo required'?'Request redo':'Request change'}</button>`:''}
 ${canRecord(d)?`<button class="btn" onclick="A.modal('outcome','${d.id}')">Record outcome</button>`:''}</div>
 ${canRecord(d)?'<p class="muted" style="font-size:13px">Recording the outcome is a stand-in. Step 2 replaces it with the observer checklist on drill day.</p>':''}
 <h2 style="margin-top:20px">History</h2><div class="hist">${d.history.slice().reverse().map(h=>`<div><div class="at">${fmt(h.at)} · ${esc(h.who)}</div>${esc(h.text)}</div>`).join('')}</div></div></div>`}
function modal(){const m=UI.modal;if(!m)return'';let h='';
 if(m.type==='change'||m.type==='redo'){const d=drill(m.id),redo=m.type==='redo';const min=addDays(S.demoDate,1);
  h=`<h2>${redo?'Request a redo':'Request a date change'} · <span class="mono">${d.id}</span></h2>
  <p class="muted">${redo?`Not completed on ${fmt(d.notDoneDate)}. The redo must be in the same month.`:`Current date ${fmtd(d.current)}. Original approved date ${fmt(d.original)} is kept.`}</p>
  <div class="field"><label>New date</label><input id="m-to" type="date" min="${min}" max="${YEAR}-12-31" oninput="liveCheck('${d.id}','${m.type}')"></div><div id="m-chk" class="msgs"></div>
  <div class="field"><label>Reason</label><select id="m-r"><option value="">Choose…</option>${REASONS.map(r=>`<option ${redo&&r.startsWith('Drill not')?'selected':''}>${r}</option>`).join('')}</select></div>
  <div class="field"><label>Comment</label><textarea id="m-c" placeholder="Optional"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn primary" onclick="A.requestChange('${d.id}',val('m-to'),val('m-r'),val('m-c'),'${m.type}')">Send to OEMC</button></div>`}
 if(m.type==='outcome'){const d=drill(m.id);h=`<h2>Record outcome · <span class="mono">${d.id}</span></h2><p class="muted">Drill date ${fmtd(d.current)}.</p>
  <div class="field"><label>Result</label><select id="m-res" onchange="document.getElementById('m-rw').style.display=this.value==='Completed'?'none':'grid'"><option>Completed</option><option>Not completed</option></select></div>
  <div class="field" id="m-rw" style="display:none"><label>Why was it not completed?</label><textarea id="m-why"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn primary" onclick="A.record('${d.id}',val('m-res'),val('m-why'))">Save</button></div>`}
 if(m.type==='return'||m.type==='reject')h=`<h2>${m.type==='return'?'Return '+unitName(m.id)+' to EPPU':'Reject '+m.id}</h2><div class="field"><label>Comment (required)</label><textarea id="m-c"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.modal=null;render()">Cancel</button><button class="btn danger" onclick="${m.type==='return'?`A.returnUnit('${m.id}',val('m-c'))`:`A.decide('${m.id}',false,val('m-c'))`}">${m.type==='return'?'Return':'Reject'}</button></div>`;
 return`<div class="modalwrap" onclick="if(event.target===this){UI.modal=null;render()}"><div class="modal">${h}</div></div>`}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function liveCheck(id,mode){const v=val('m-to'),el=document.getElementById('m-chk');if(!v){el.innerHTML='';return}const r=check(drill(id),v,mode);
 el.innerHTML=r.e.map(x=>`<div class="e">✕ ${esc(x)}</div>`).join('')+r.w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join('')+(!r.e.length&&!r.w.length?'<div class="ok">✓ No conflicts found</div>':'')}

/* ---------- Shell ---------- */
const PAGES=[['Work',[['overview','Overview'],['plan','Annual plan'],['approvals','Approvals'],['changes','Change control'],['moh','MOH / MSMD copy']]],
 ['Data',[['master','Master lists'],['data','Datasphere (sample)'],['emails','Email log']]],['Help',[['about','About this demo']]]];
function render(){const n=counts();const props=[...new Set(S.drills.length?S.drills.map(d=>d.dept):CODES.flatMap(c=>AREAS.map(a=>proponentFor(c.id,a.id))))];
 const page={overview:pOverview,plan:pPlan,approvals:pApprovals,changes:pChanges,moh:pMOH,master:pMaster,data:pData,emails:pEmails,about:pAbout}[UI.page]();
 document.getElementById('app').innerHTML=`<header class="shell"><div class="brand"><span class="mark">DR</span>EPPU Drill Manager</div><span class="demo-tag">Demo · sample data</span><span class="sp"></span>
 <label>View as <select onchange="A.setRole(this.value)"><option value="admin" ${S.role==='admin'?'selected':''}>EPPU admin</option><option value="proponent" ${S.role==='proponent'?'selected':''}>Proponent</option><option value="oemc" ${S.role==='oemc'?'selected':''}>OEMC reviewer</option></select></label>
 ${S.role==='proponent'?`<label>Dept <select onchange="A.setDept(this.value)">${DEPTS.filter(d=>props.includes(d.id)).map(d=>`<option value="${d.id}" ${S.dept===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>`:''}
 <label>Demo date <input type="date" value="${S.demoDate}" onchange="A.setDate0(this.value)"></label>
 <button class="btn sm" onclick="A.reset(S.demoDate>'2026-01-01'?'mid':'fresh')" title="Restore the sample data in this browser">Reset</button></header>
 <div class="layout"><nav>${PAGES.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,l])=>`<button class="${UI.page===k?'on':''}" onclick="A.go('${k}')"><span>${l}</span>${k==='approvals'&&n.appr?`<span class="badge">${n.appr}</span>`:''}</button>`).join('')).join('')}</nav>
 <main>${page}</main></div>${drawer()}${modal()}`;
 renderTable()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.drawer||UI.modal))A.close()});
render();
</script>
</body>
</html>
